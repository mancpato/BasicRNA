<style>
  :root {

    display: flex; align-items: center; gap: 14px;
    margin: 0 0 20px; padding: 12px 16px;
    background: var(--papel); border: 1px solid var(--linea); border-radius: 8px;

  .selector > span { font-weight: 600; font-size: 14px; }
  .selector label {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border: 1px solid var(--linea); border-radius: 6px;

  .selector label.puesto { border-color: var(--tinta); background: #eef2f6; font-weight: 600; }

     elección de activación y separados de ella por una línea. No están dentro
     del mando porque no necesitan parámetro seleccionado para funcionar. */
  .selector .divisor { width: 1px; align-self: stretch; background: var(--linea); margin: -4px 4px; }

     después los dos botones, y al cambiar no se mueve nada de la barra. */
  .selector .ranura { display: flex; align-items: center; gap: 10px; min-height: 36px; }
  .selector .consigna { font-size: 13.5px; color: var(--tinta-suave); }
  .selector button {
    font: inherit; font-size: 13.5px; padding: 7px 14px; cursor: pointer;
    background: #fbfcfd; color: var(--tinta);

  .contador .rotulo { font-size: 13px; color: var(--tinta-suave); }

  .mando.apagado .pista,

'use strict';
/*
Explorador de parámetros — red 2→4→1

Se selecciona cada conexión de la red y se mueve su peso o su sesgo con el
deslizador. La meta es separar dos clases que NINGUNA recta separa: un disco
alrededor del origen contra el anillo que lo rodea. El alumno puede ver cómo se
mueve la frontera y cómo cambia la predicción de la red en cada punto del
cuadrado. Puede pedir los pesos entrenados pero este ejercicio no es de
entrenamiento: es de exploración.

En clase debe explicarse que la red se entrena con datos que son coordenadas de
puntos en dos clases, así que los datos de entrenamiento son de la forma
(x_i, y_i, clase); y que el selector de arriba cambia UNA sola cosa, la
activación de la capa oculta, de modo que se vea qué le toca a la activación y
qué le toca a los pesos.

Es la página SIGUIENTE a explorador-neurona.html, que tiene una neurona y tres
parámetros. Allá cada parámetro hace algo que se puede decir en una frase: los
dos pesos giran la recta, el sesgo la desplaza. Aquí son diecisiete y ya no:
mover un peso cambia el mapa de un modo que nadie puede anticipar, y ése es el
punto de tenerla. El alumno llega primero a cero errores a mano con tres
parámetros, sabe lo que se siente entender un parámetro, y sólo entonces pasa a
esta red, donde la intuición ya no alcanza y hace falta el descenso por
gradiente.

QUÉ ES LA PÁGINA
Dos redes de la misma forma, 2→4→1 con salida sigmoide, entrenadas sobre los
mismos puntos hasta clasificarlos sin un solo error. La única diferencia entre
ellas es la activación de la capa oculta: una usa ReLU y la otra tanh. A la
izquierda, lo que la red predice en cada punto del cuadrado; a la derecha, los
diecisiete parámetros que producen ese dibujo, uno por línea. La página abre con
pesos al azar, los mismos para las dos redes, y el alumno pide los entrenados
cuando quiere.

Parámetros
  theta[0..3]    pesos de x1 a h1,h2,h3,h4
  theta[4..7]    pesos de x2 a h1,h2,h3,h4
  theta[8..11]   sesgos de h1,h2,h3,h4
  theta[12..15]  pesos de h1,h2,h3,h4 a la salida
  theta[16]      sesgo de la salida

EL ORDEN DE theta, Y POR QUÉ IMPORTA
theta[i*NOCULTA + j] es el peso de la entrada i a la neurona oculta j. Con ese
orden evalúa la red y con ese orden se dibuja el diagrama, y tienen que ser el
mismo: con el orden traspuesto, j*NENT + i, de las ocho aristas de entrada sólo
coinciden dos, y las otras seis se dibujarían con el grosor de otro peso y el
deslizador movería un parámetro distinto del que se señaló. Toda la página
descansa en que la línea que se señala sea el parámetro que se mueve.

LOS DATOS Y LOS PESOS PRECALCULADOS
200 puntos en [-1,1]^2, partidos en 160 de entrenamiento y 40 de prueba. La
clase 0 ocupa un disco alrededor del origen, de radio hasta 0.41, y la clase 1
el anillo que va de 0.60 hacia afuera. Entre las dos hay holgura, pero no hay
recta que las separe: por eso esta red necesita la capa oculta y la neurona sola
de explorador-neurona.html no podría con estos datos.

Los pesos de las dos redes salieron de descenso por gradiente con eta 0.05,
momento 0.9 e inicialización Xavier, y quedaron horneados en este archivo. Las
dos llegan a cero mal clasificados en las dos particiones. El mayor |theta| de
las dos vale 5.22, cómodamente dentro del recorrido del deslizador.

La retícula del mapa es de 50x50 y la frontera se traza por cambio de signo
entre celdas vecinas. Aritmética nativa de JavaScript, binary64. Un solo
archivo, sin dependencias, sin build; se abre con doble clic y dibuja con
canvas 2D.

¡Feliz entrenamiento! :-)

Prof. Miguel Ángel Norzagaray Cosío
*/

    var cx0 = Math.round(MARCO + j * cel), cx1 = Math.round(MARCO + (j + 1) * cel);
    var cy0 = Math.round(MARCO + i * cel), cy1 = Math.round(MARCO + (i + 1) * cel);
    ctx.fillRect(cx0, cy0, cx1 - cx0, cy1 - cy0);
  }

  // ejes y marco
  ctx.strokeStyle = '#c9d0d6'; ctx.lineWidth = 1;
  ctx.strokeRect(MARCO + 0.5, MARCO + 0.5, lado - 1, lado - 1);
  ctx.strokeStyle = '#aeb7bf';
  var o = aPixel(0, 0), a0 = aPixel(-1, 0), a1 = aPixel(1, 0), b0 = aPixel(0, -1), b1 = aPixel(0, 1);
  ctx.beginPath();
  ctx.moveTo(a0.px, o.py); ctx.lineTo(a1.px, o.py);
  ctx.moveTo(o.px, b0.py); ctx.lineTo(o.px, b1.py);
  ctx.stroke();
  ctx.fillStyle = '#6d777f'; ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (var v = -1; v <= 1.001; v += 0.5) {
    var vr = Math.round(v * 10) / 10;
    if (Math.abs(vr) < 0.01) continue;
    var t1 = aPixel(vr, 0), t2 = aPixel(0, vr);
    ctx.beginPath(); ctx.moveTo(t1.px, o.py - 4); ctx.lineTo(t1.px, o.py + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.px - 4, t2.py); ctx.lineTo(o.px + 4, t2.py); ctx.stroke();
    ctx.fillText(vr.toFixed(1), t1.px, o.py + 6);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(vr.toFixed(1), o.px - 6, t2.py);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  }
  ctx.fillStyle = '#3a434b'; ctx.font = '13px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('x₁', a1.px + 7, o.py);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('x₂', o.px, b1.py - 7);

  // la frontera, como polígono cerrado
  var P = ordenar(frontera(g));
  if (P.length > 1) {
    ctx.strokeStyle = 'rgba(28,34,40,0.85)'; ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var k = 0; k < P.length; k++) {
      var q = aPixel(P[k].x1, P[k].x2);
      if (k === 0) ctx.moveTo(q.px, q.py); else ctx.lineTo(q.px, q.py);
    }
    ctx.closePath(); ctx.stroke();
  }

  // los datos: entrenamiento en círculo, prueba en cruz
  for (var d = 0; d < PUNTOS_TRAIN.length; d++) {
    var pt = PUNTOS_TRAIN[d], pp = aPixel(pt[0], pt[1]);
    ctx.fillStyle = COLOR_CLASE[pt[2]];
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pp.px, pp.py, 4.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  var BRAZO = 5;
  ctx.lineWidth = 2.3;
  for (var e = 0; e < PUNTOS_TEST.length; e++) {
    var qt = PUNTOS_TEST[e], qq = aPixel(qt[0], qt[1]);
    ctx.strokeStyle = COLOR_CLASE[qt[2]];
    ctx.beginPath();
    ctx.moveTo(qq.px - BRAZO, qq.py); ctx.lineTo(qq.px + BRAZO, qq.py);
    ctx.moveTo(qq.px, qq.py - BRAZO); ctx.lineTo(qq.px, qq.py + BRAZO);
    ctx.stroke();
  }
  return P.length;
}

/* La forma de la activación de un nodo, en blanco dentro de su círculo. Caja
   de media anchura A y media altura B = A/2: con esa relación la diagonal de
   la ReLU queda a 45°, y tiene que seguir valiendo si cambia A. La esquina de
   la caja queda a 12.3 px del centro, holgada dentro del radio 17. */
function glifoActivacion(ctx, cx, cy, cual) {
  var A = 11, B = A / 2, k, t;
  ctx.save();
  // la rayita del cero; en relu el tramo plano de la curva ya está ahí
  if (cual !== 'relu') {
    var y0 = (cual === 'tanh') ? cy : cy + B;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - A, y0); ctx.lineTo(cx + A, y0); ctx.stroke();
  }
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (cual === 'relu') {
    ctx.moveTo(cx - A, cy + B); ctx.lineTo(cx, cy + B); ctx.lineTo(cx + A, cy - B);
  } else if (cual === 'tanh') {
    for (k = 0; k < 13; k++) {
      t = -2.6 + k * (5.2 / 12);
      var xt = cx + (t / 2.6) * A, yt = cy - Math.tanh(t) * B;
      if (k === 0) ctx.moveTo(xt, yt); else ctx.lineTo(xt, yt);
    }
  } else {
    // sale idéntica a la de tanh porque sigma(z) = (tanh(z/2)+1)/2
    for (k = 0; k < 13; k++) {
      t = -5.2 + k * (10.4 / 12);
      var xs = cx + (t / 5.2) * A, ys = (cy + B) - (1 / (1 + Math.exp(-t))) * 2 * B;
      if (k === 0) ctx.moveTo(xs, ys); else ctx.lineTo(xs, ys);
    }
  }
  ctx.stroke();
  ctx.restore();
}

/* El diagrama. El grosor sale de theta[a.idx] y de nada más: si el descriptor
   apuntara a otro parámetro, la línea engordaría en otro sitio. Contra qué se
   mide, y por qué, va en el comentario de adentro. */
function dibujarRed(vista, theta, aristas, resalte, selec, act) {
  var ctx = vista.ctx;
  ctx.clearRect(0, 0, vista.w, vista.h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, vista.w, vista.h);

  /* El grosor y la opacidad se miden contra el TOPE DEL DESLIZADOR, no contra
     el mayor |θ| de los diecisiete actuales. Con el normalizador móvil, que es
     como estaba, arrastrar el parámetro más grande cambiaba el grosor de las
     otras dieciséis líneas solas: mientras ese parámetro fuera el máximo, el
     normalizador viajaba con él, y el alumno veía moverse dieciséis líneas que
     no había tocado. Con el tope fijo, el mismo valor se dibuja siempre igual y
     dos posiciones del pomo son comparables, igual que el propio recorrido.

     La raíz está por resolución en el extremo chico: con el cociente directo
     contra 6, θ = 0.1 y θ = 0.5 saldrían a 1.15 y 1.75 px y serían casi el
     mismo pelo; con la raíz salen a 2.2 y 3.6 px.

     Las dos funciones reciben el VALOR del parámetro, no el descriptor de la
     arista, y ninguna mira el resto del vector: ahí está todo el arreglo. */
  var porIdx = {};
  for (var m = 0; m < aristas.length; m++) porIdx[aristas[m].idx] = aristas[m];
  function fuerza(v) { return Math.sqrt(Math.min(Math.abs(v) / RANGO_MAX, 1)); }
  function grosorDe(v) { return 1 + fuerza(v) * 9; }

  ctx.lineCap = 'round';
  /* Los halos van DEBAJO de todas las líneas: así ninguno tapa a su vecina.
     El seleccionado y el resaltado se marcan distinto, para que se distingan
     cuando el ratón está encima de otra línea. */
  [{ i: selec,   color: 'rgba(140,90,200,0.55)', mas: 15 },
   { i: resalte, color: 'rgba(90,105,120,0.32)', mas: 9  }].forEach(function (h) {
    if (h.i === null || h.i === undefined || !porIdx[h.i]) return;
    var a = porIdx[h.i];
    ctx.lineWidth = grosorDe(theta[a.idx]) + h.mas;
    ctx.strokeStyle = h.color;
    ctx.beginPath(); ctx.moveTo(a.ax, a.ay); ctx.lineTo(a.bx, a.by); ctx.stroke();
  });

  for (var n = 0; n < aristas.length; n++) {
    var a = aristas[n], w = theta[a.idx];
    var t = fuerza(w);
    /* El resaltado engorda y gana opacidad, pero NO cambia de color: el color
       codifica el signo y no puede querer decir dos cosas. */
    var realce = (a.idx === resalte) ? 2.5 : 0;
    var opac = (a.idx === resalte || a.idx === selec) ? Math.min(1, 0.55 + t * 0.45) : 0.28 + t * 0.7;
    ctx.lineWidth = grosorDe(w) + realce;
    ctx.strokeStyle = (w >= 0 ? 'rgba(60,100,210,' : 'rgba(210,60,60,') + opac.toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(a.ax, a.ay); ctx.lineTo(a.bx, a.by); ctx.stroke();
  }

  var COLOR_NODO = ['rgb(200,100,100)', 'rgb(80,130,200)', 'rgb(80,180,120)'];
  var BORDE_NODO = ['rgb(120,60,60)', 'rgb(48,78,120)', 'rgb(48,108,72)'];
  for (var c = 0; c < GEO.capas.length; c++) {
    var idc = c === 0 ? 0 : (c === GEO.capas.length - 1 ? 2 : 1);
    for (var i = 0; i < GEO.capas[c]; i++) {
      ctx.fillStyle = COLOR_NODO[idc]; ctx.strokeStyle = BORDE_NODO[idc]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(GEO.xs[c], GEO.ys[c][i], GEO.RADIO, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      if (idc === 1) glifoActivacion(ctx, GEO.xs[c], GEO.ys[c][i], act);
      else if (idc === 2) glifoActivacion(ctx, GEO.xs[c], GEO.ys[c][i], 'sigmoide');
    }
  }
  // nodos de sesgo: triángulo
  ctx.fillStyle = 'rgb(255,220,50)'; ctx.strokeStyle = 'rgb(180,150,0)'; ctx.lineWidth = 2;
  for (var s = 0; s < GEO.xBias.length; s++) {
    var bx = GEO.xBias[s], by = GEO.yBias[s], T = GEO.TB;
    ctx.beginPath();
    ctx.moveTo(bx, by - T); ctx.lineTo(bx - T, by + T); ctx.lineTo(bx + T, by + T);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6d5b00'; ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('1', bx, by + T + 4);
    ctx.fillStyle = 'rgb(255,220,50)';
  }

  /* Los rotulos de capa (Entrada, Oculta, Salida) se dibujaban aqui, sobre el
     margen superior. Se quitaron: la forma de la red los dice sola y ocupaban
     34 px de alto. */
  ctx.font = '14px system-ui, sans-serif'; ctx.fillStyle = '#3a434b';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var q = 0; q < NENT; q++) ctx.fillText('x' + SUB[q], GEO.xs[0] - GEO.RADIO - 8, GEO.ys[0][q]);
  ctx.textAlign = 'left';
  for (var h = 0; h < NOCULTA; h++)
    ctx.fillText('h' + SUB[h], GEO.xs[1] + GEO.RADIO + 8, GEO.ys[1][h] - GEO.RADIO - 2);
  ctx.fillText('ŷ', GEO.xs[2] + GEO.RADIO + 8, GEO.ys[2][0]);

  /* Las barritas de estado, SÓLO con tanh. Cada una es el recorrido completo de
     la activación, de −1 a 1 con el cero marcado, y dentro, coloreado, el tramo
     que esa neurona barre sobre los 200 puntos. Se recalcula en cada redibujado
     — que es el punto: se mueve un parámetro, el mapa no se inmuta, y la
     barrita dice que la neurona está pegada a un extremo.
     Sin números ni rótulos: la explicación va en la hoja de apoyo. */
  if (act === 'tanh') {
    var BW = 84, BH = 9, BY = GEO.RADIO + 8;
    for (var n2 = 0; n2 < NOCULTA; n2++) {
      var x0 = GEO.xs[1] - BW / 2, y0 = GEO.ys[1][n2] + BY;
      ctx.fillStyle = '#f1f4f7'; ctx.strokeStyle = '#b9c2ca'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.rect(x0 + 0.5, y0 + 0.5, BW - 1, BH - 1);
      ctx.fill(); ctx.stroke();
      var tr = tramoNeurona(theta, act, n2);
      var aX = x0 + (tr.min + 1) / 2 * BW, bX = x0 + (tr.max + 1) / 2 * BW;
      if (bX - aX < 2) { var c2 = (aX + bX) / 2; aX = c2 - 1; bX = c2 + 1; }
      ctx.fillStyle = 'rgba(80,130,200,0.88)';
      ctx.fillRect(aX, y0 + 1.5, bX - aX, BH - 3);
      /* el cero se marca ENCIMA del tramo: si quedara debajo, una neurona que
         cruza el cero lo escondería justo cuando más se quiere ver. */
      ctx.strokeStyle = 'rgba(40,48,56,0.75)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x0 + BW / 2, y0 - 1.5); ctx.lineTo(x0 + BW / 2, y0 + BH + 1.5);
      ctx.stroke();
    }
  }
}

/* ── El tramo que barre cada neurona oculta sobre los 200 puntos ───────────
   Sólo tiene sentido con una activación ACOTADA: la tanh recorre (−1, 1) y hay
   un recorrido fijo contra el cual medir. La ReLU no tiene techo, así que no
   existe ese recorrido y las barritas no se dibujan en esa red — un indicador
   con la misma forma y sin la misma escala confundiría más de lo que aclara. */
function tramoNeurona(theta, act, j) {
  var mn = Infinity, mx = -Infinity;
  function ver(p) {
    var z = preActivacion(theta, j, p[0], p[1]);
    var h = (act === 'relu') ? Math.max(0, z) : Math.tanh(z);
    if (h < mn) mn = h;
    if (h > mx) mx = h;
  }
  for (var a = 0; a < PUNTOS_TRAIN.length; a++) ver(PUNTOS_TRAIN[a]);
  for (var b = 0; b < PUNTOS_TEST.length; b++) ver(PUNTOS_TEST[b]);
  return { min: mn, max: mx };
}

/* ── Selección con el ratón ────────────────────────────────────────────────
   Las 17 líneas convergen en los nodos, y cerca de uno hay hasta cinco a pocos
   píxeles unas de otras. Señalar la equivocada es el peor fallo posible aquí,
   porque el alumno creería estar moviendo un parámetro mientras mueve otro.
   La regla es: ANTE LA DUDA NO SE SELECCIONA NADA. */
function distanciaPuntoSegmento(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  var t = (L2 === 0) ? 0 : ((px - ax) * dx + (py - ay) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  var qx = ax + t * dx, qy = ay + t * dy;
  return Math.hypot(px - qx, py - qy);
}
/* Distancias a los 17 segmentos, ordenadas. Se usan SÓLO las posiciones de los
   nodos en pantalla, nunca el grosor dibujado: un parámetro chico se dibuja
   como un pelo y sería imposible de atinar, y uno grande acapararía a sus
   vecinas — el blanco de un parámetro no puede depender de su valor. */
function distanciasA(px, py) {
  var d = [];
  for (var n = 0; n < ARISTAS.length; n++) {
    var a = ARISTAS[n];
    d.push({ idx: a.idx, d: distanciaPuntoSegmento(px, py, a.ax, a.ay, a.bx, a.by) });
  }
  d.sort(function (p, q) { return p.d - q.d; });
  return d;
}
/* Hay candidata sólo si se cumplen las TRES: la más cercana cae dentro de la
   tolerancia, la siguiente está al menos al doble de distancia, y la siguiente
   está además a MARGEN_SEPARACION píxeles de la primera. Si falta cualquiera,
   las dos compiten en esa posición y NO hay candidata, por minúscula que sea
   la primera. */
function candidataEn(px, py) {
  var d = distanciasA(px, py);
  if (d[0].d > TOL_CAPTURA) return null;
  if (d[1].d < 2 * d[0].d) return null;
  if (d[1].d - d[0].d < MARGEN_SEPARACION) return null;
  return d[0].idx;
}

/* ── Montaje ───────────────────────────────────────────────────────────────*/
var ARISTAS = null, vistaMapa = null, vistaRed = null, nodos = {}, mando = {};
var seleccionado = null;   /* índice en theta, o null */
var resaltado = null;      /* la candidata bajo el ratón, o null */

function redibujar() {
  var r = red();
  dibujarMapa(vistaMapa, r.trabajo, r.activacion);
  dibujarRed(vistaRed, r.trabajo, ARISTAS, resaltado, seleccionado, r.activacion);
  actualizarLectura();

  var eTrain = malClasificados(r.trabajo, r.activacion, PUNTOS_TRAIN);
  var eTest  = malClasificados(r.trabajo, r.activacion, PUNTOS_TEST);
  nodos.cifraTrain.textContent = eTrain;
  nodos.cifraTest.textContent = eTest;
  nodos.cifraTrain.className = 'cifra ' + (eTrain === 0 ? 'cero' : 'noCero');
  nodos.cifraTest.className = 'cifra ' + (eTest === 0 ? 'cero' : 'noCero');
  /* Describe la frontera de la red ENTRENADA; sobre un mapa al azar seria
     falso, asi que no se dice hasta que se revela. */
  nodos.pieRed.textContent = revelado ? r.pie : '';
  Array.prototype.forEach.call(nodos.etiquetas, function (lab) {
    lab.className = (lab.dataset.red === redActiva) ? 'puesto' : '';
  });
}

/* Posición en píxeles del centro del pomo para un valor dado. El pomo recorre
   desde POMO/2 hasta PISTA_W − POMO/2, no de 0 a PISTA_W: sin descontarlo las
   dos marcas quedarían corridas respecto del pomo en los extremos. */
function aPista(v) {
  var t = (v - RANGO_MIN) / (RANGO_MAX - RANGO_MIN);
  return POMO / 2 + t * (PISTA_W - POMO);
}
function actualizarLectura() {
  if (seleccionado === null) return;
  mando.val.textContent = red().trabajo[seleccionado].toFixed(3);
}
/* Se llama cuando cambia la SELECCIÓN o la RED, no en cada movimiento: escribir
   slider.value mientras el alumno arrastra pelearía con el arrastre. */
function sincronizarMando() {
  var r = red();
  if (seleccionado === null) {
    mando.caja.className = 'mando apagado';
    mando.slider.disabled = true;
    mando.slider.value = 0;
    mando.rot.className = 'mando-rot vacio';
    mando.rot.textContent = 'ningún parámetro seleccionado — haz clic en una línea del diagrama';
    mando.val.className = 'mando-val nada';
    mando.val.textContent = '—';
    mando.orig.style.visibility = 'hidden';
    return;
  }
  mando.caja.className = 'mando';
  mando.slider.disabled = false;
  mando.slider.value = r.trabajo[seleccionado];
  mando.rot.className = 'mando-rot';
  mando.rot.textContent = NOMBRES[seleccionado] + '   (θ[' + seleccionado + '])';
  mando.val.className = 'mando-val';
  /* La marca tenue va en el valor ORIGINAL de ese parámetro EN LA RED QUE ESTÁ
     SELECCIONADA. Los cambios se acumulan al saltar de un parámetro a otro, así
     que sin ella no hay forma de saber cuánto se alejó uno. */
  mando.orig.style.visibility = revelado ? 'visible' : 'hidden';
  if (revelado) mando.orig.style.left = (aPista(r.original[seleccionado]) - 1.5) + 'px';
  actualizarLectura();
}
/* Devuelve los 17 de la red seleccionada a sus valores ORIGINALES EXACTOS —los
   horneados—, no a los redondeados a la centésima del paso del deslizador. La
   otra red no se toca: cada una conserva sus propios valores de trabajo. */
function restaurarTodo() {
  var r = red();
  r.trabajo = r.original.slice();
  /* La primera vez que se aprieta, además de poner los pesos, destapa lo que
     enseña la solución. No se vuelve atrás: una vez vista, vista. */
  if (!revelado) { revelado = true; abrirLoDeRevelado(); }
  sincronizarMando();   // el que estuviera seleccionado sigue estándolo
  redibujar();
}

/* Los dos renglones de leyenda que hablan del valor entrenado. Se arman
   ocultos en montar y se encienden aquí. */
function abrirLoDeRevelado() {
  ['nota-dblclic', 'nota-orig'].forEach(function (id) {
    var e = document.getElementById(id);
    if (e) e.style.display = '';
  });
}

/* Cuenta el parámetro movido y, al llegar al umbral, cambia la consigna de la
   barra por los dos botones. Cuenta ÍNDICES DISTINTOS, no movimientos: un solo
   arrastre del deslizador dispara decenas de eventos. */
function registrarTocado(idx) {
  if (TOCADOS.indexOf(idx) < 0) TOCADOS.push(idx);
  if (ranuraAbierta || TOCADOS.length < UMBRAL_RANURA) return;
  ranuraAbierta = true;
  document.getElementById('ranura-consigna').style.display = 'none';
  document.getElementById('btn-originales').style.display = '';
  document.getElementById('btn-aleatorios').style.display = '';
}
/* Sortea los 17 de la red seleccionada, cada uno uniforme en el recorrido del
   deslizador: apretarlo equivale a poner los diecisiete deslizadores al azar,
   así que los valores caen en la rejilla del paso, como caerían a mano. */
function aleatorizarTodo() {
  var r = red();
  nSorteo++;
  var semilla = SEMILLA_BASE + nSorteo;
  var rng = new Sorteador(semilla), v = [];
  for (var k = 0; k < NPARAM; k++) {
    var u = RANGO_MIN + rng.next() * (RANGO_MAX - RANGO_MIN);
    v.push(Math.round(u / PASO) * PASO);
  }
  r.trabajo = v;
  /* Aqui se escribia en pantalla 'sorteo n · semilla s'. Ya no se muestra, pero
     la regla sigue siendo esa: el sorteo n usa la semilla SEMILLA_BASE + n, de
     modo que cualquier sorteo se reproduce recargando y apretando n veces. */
  sincronizarMando();
  redibujar();
}
/* Devuelve UN parámetro a su valor original exacto. Existe porque el paso del
   deslizador es de una centésima: volver a mano deja −1.11 donde iba
   −1.108638…, y hoy no hay otra forma de deshacer uno solo sin perder los
   demás. */
function restaurarUno(idx) {
  var r = red();
  r.trabajo[idx] = r.original[idx];
  seleccionar(idx);
}

/* Al seleccionar otro parámetro el deslizador salta al valor que ese parámetro
   tenga AHORA, y la marca tenue a su original. El que se deja atrás se queda
   donde el deslizador lo dejó. */
function seleccionar(idx) {
  seleccionado = idx;
  sincronizarMando();
  redibujar();
}

function deseleccionar() {
  seleccionado = null;
  sincronizarMando();
  redibujar();
}

function montar() {
  var raiz = document.getElementById('raiz');

  var sel = document.createElement('div');
  sel.className = 'selector';
  sel.innerHTML = '<span>Activación de la capa oculta:</span>';
  ['relu', 'tanh'].forEach(function (clave) {
    var lab = document.createElement('label');
    lab.dataset.red = clave;
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = 'red'; inp.value = clave;
    inp.checked = (clave === redActiva);
    inp.addEventListener('change', function () {
      /* activación, trabajo y original cambian a la vez. Cada red conserva sus
         PROPIOS valores de trabajo: si el alumno mueve tres parámetros en ReLU,
         pasa a Tanh y vuelve, los tres siguen movidos. */
      redActiva = clave;
      sincronizarMando();    // el pomo salta al valor en ESTA red, y la marca
      redibujar();           // tenue al original de ESTA red
    });
    lab.appendChild(inp);
    lab.appendChild(document.createTextNode(REDES[clave].etiqueta));
    sel.appendChild(lab);
  });
  /* Aqui iba un span.nota que decia 'pesos originales, tal como quedaron al
     converger' o 'pesos modificados respecto de los originales'. Se quito: el
     estado por parametro ya lo dice la marca tenue del deslizador. */
  var div = document.createElement('span');
  div.className = 'divisor';
  sel.appendChild(div);
  var ranura = document.createElement('span');
  ranura.className = 'ranura';
  var consigna = document.createElement('span');
  consigna.className = 'consigna'; consigna.id = 'ranura-consigna';
  consigna.textContent = 'acomoda los pesos a mano y baja los mal clasificados';
  ranura.appendChild(consigna);
  var bOrig = document.createElement('button');
  bOrig.type = 'button'; bOrig.id = 'btn-originales';
  bOrig.textContent = 'Mostrar los pesos entrenados';
  bOrig.style.display = 'none';
  ranura.appendChild(bOrig);
  var bAzar = document.createElement('button');
  bAzar.type = 'button'; bAzar.id = 'btn-aleatorios'; bAzar.textContent = 'Valores al azar';
  bAzar.style.display = 'none';
  ranura.appendChild(bAzar);
  sel.appendChild(ranura);
  raiz.appendChild(sel);

  var tablero = document.createElement('div');
  tablero.className = 'tablero';

  // ── columna del mapa, con el contador encima ──
  var cajaMapa = document.createElement('div');
  cajaMapa.className = 'caja';
  cajaMapa.style.width = (MAPA_L + 38) + 'px';   // si no, la leyenda ensancha la caja
                                                 // y el par deja de ir lado a lado
  var cont = document.createElement('div');
  cont.className = 'contador';
  cont.innerHTML =
    '<div class="par"><span class="cifra cero" id="err-train">–</span>' +
    '<span class="rotulo">mal clasificados<br><span class="de">de 160 de entrenamiento</span></span></div>' +
    '<div class="par"><span class="cifra cero" id="err-test">–</span>' +
    '<span class="rotulo">mal clasificados<br><span class="de">de 40 de prueba</span></span></div>';
  cajaMapa.appendChild(cont);
  vistaMapa = lienzo(MAPA_L, MAPA_L);
  cajaMapa.appendChild(vistaMapa.el);
  var legM = document.createElement('div');
  legM.className = 'leyenda';
  legM.innerHTML =
    '<span class="it"><span class="punto" style="background:#4b8bbe"></span>clase 0</span>' +
    '<span class="it"><span class="punto" style="background:#e8825a"></span>clase 1</span>' +
    '<span class="it">● entrenamiento · ✚ prueba</span>' +
    '<span class="it"><span class="marca" style="background:#1c2228"></span>frontera, donde la salida vale 0.5</span>' +
    '<span class="it">intensidad = confianza</span>';
  cajaMapa.appendChild(legM);
  tablero.appendChild(cajaMapa);

  // ── columna del diagrama ──
  var cajaRed = document.createElement('div');
  cajaRed.className = 'caja';
  cajaRed.style.width = (DIAG_W + 38) + 'px';
  /* El mando va PEGADO al diagrama, que es donde se elige el parámetro, y con
     el mapa al lado para ver el efecto sin desplazar. Va ENCIMA del lienzo:
     suben la cabecera con el nombre y el valor, la pista y su pie con los dos
     extremos del rango. La nota de leyendas se queda debajo del lienzo. */
  var cajaMando = document.createElement('div');
  cajaMando.className = 'mando apagado';
  cajaMando.innerHTML =
    '<div class="mando-cab">' +
      '<span class="mando-rot vacio" id="mando-rot">ningún parámetro seleccionado</span>' +
      '<span class="mando-val nada" id="mando-val">—</span>' +
    '</div>' +
    '<div class="pista" id="mando-pista" style="width:' + PISTA_W + 'px">' +
      '<span class="hito hito-orig" id="mando-orig"></span>' +
      '<span class="hito hito-cero" id="mando-cero"></span>' +
      '<input type="range" id="mando-slider" disabled' +
        ' min="' + RANGO_MIN + '" max="' + RANGO_MAX + '" step="' + PASO + '" value="0"' +
        ' style="width:' + PISTA_W + 'px">' +
    '</div>' +
    '<div class="pista-pie" style="width:' + PISTA_W + 'px">' +
      '<span>' + RANGO_MIN + '</span><span class="der">+' + RANGO_MAX + '</span></div>';
  cajaRed.appendChild(cajaMando);

  vistaRed = lienzo(DIAG_W, DIAG_H);
  cajaRed.appendChild(vistaRed.el);

  var notaMando = document.createElement('div');
  notaMando.className = 'mando-nota';
  notaMando.innerHTML =
    '<span class="it" id="nota-dblclic" style="display:none">doble clic en una línea: devuelve ese parámetro a su valor entrenado</span>' +
    '<span class="it"><span class="llave" style="background:#4a545d"></span>cero, el centro exacto</span>' +
    '<span class="it" id="nota-orig" style="display:none"><span class="llave" style="background:#0f6e62;opacity:0.5"></span>valor entrenado</span>' +
    '<span class="it"><span class="llave" style="background:rgba(140,90,200,0.55)"></span>parámetro seleccionado</span>' +
    '<span class="it"><span class="llave" style="background:rgba(90,105,120,0.32)"></span>bajo el ratón</span>';
  cajaRed.appendChild(notaMando);

  var legR = document.createElement('div');
  legR.className = 'leyenda';
  legR.innerHTML =
    '<span class="it"><span class="marca" style="background:#3c64d2"></span>positivo</span>' +
    '<span class="it"><span class="marca" style="background:#d23c3c"></span>negativo</span>' +
    '<span class="it">grosor = |θ| contra el tope del deslizador</span>' +
    '<span class="it">▲ = entrada constante 1, el sesgo</span>' +
    '<span class="it" id="pie-red"></span>';
  cajaRed.appendChild(legR);
  tablero.appendChild(cajaRed);

  raiz.appendChild(tablero);
  /* El bloque 'Cómo se hizo' que iba aquí está ahora en el comentario de
     cabecera del archivo. */

  /* Para que h1 caiga a la altura donde empieza el cuadro del mapa, los dos
     lienzos tienen que arrancar a la misma altura, y las dos cabeceras no
     miden lo mismo: el contador a la izquierda, el mando a la derecha. Se
     miden ya montadas y se le da a la mas corta el sobrante como margen. Se
     mide, no se calcula: el alto de cada una depende de la fuente y del ancho
     que tenga el navegador. */
  var hCont = cont.offsetHeight, hMando = cajaMando.offsetHeight;
  if (hCont > hMando) cajaMando.style.marginBottom = (14 + hCont - hMando) + 'px';
  else if (hMando > hCont) cont.style.marginBottom = (14 + hMando - hCont) + 'px';

  nodos.cifraTrain = document.getElementById('err-train');
  nodos.cifraTest = document.getElementById('err-test');
  nodos.pieRed = document.getElementById('pie-red');
  nodos.etiquetas = sel.querySelectorAll('label');

  mando.caja = cajaMando;
  mando.rot = document.getElementById('mando-rot');
  mando.val = document.getElementById('mando-val');
  mando.slider = document.getElementById('mando-slider');
  mando.orig = document.getElementById('mando-orig');
  mando.cero = document.getElementById('mando-cero');
  document.getElementById('btn-originales').addEventListener('click', restaurarTodo);
  document.getElementById('btn-aleatorios').addEventListener('click', aleatorizarTodo);
  mando.cero.style.left = (aPista(0) - 1) + 'px';

  /* Cada movimiento del deslizador recalcula el mapa, el grosor de las líneas y
     el contador de error — en 'input', no en 'change': son 200 evaluaciones de
     la red y no hay problema de tiempo. */
  mando.slider.addEventListener('input', function () {
    if (seleccionado === null) return;
    red().trabajo[seleccionado] = parseFloat(mando.slider.value);
    registrarTocado(seleccionado);
    redibujar();
  });

  /* El ratón sobre el diagrama. Si no hay candidata no se resalta nada y el
     cursor es el normal; el clic sin candidata NO HACE NADA — no deselecciona,
     no selecciona la más cercana, no adivina. La selección se suelta con ESC. */
  function posRaton(ev) {
    var r = vistaRed.el.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (vistaRed.w / r.width),
             y: (ev.clientY - r.top) * (vistaRed.h / r.height) };
  }
  vistaRed.el.addEventListener('mousemove', function (ev) {
    var q = posRaton(ev), c = candidataEn(q.x, q.y);
    vistaRed.el.style.cursor = (c === null) ? 'default' : 'pointer';
    if (c !== resaltado) { resaltado = c; redibujar(); }
  });
  vistaRed.el.addEventListener('mouseleave', function () {
    vistaRed.el.style.cursor = 'default';
    if (resaltado !== null) { resaltado = null; redibujar(); }
  });
  vistaRed.el.addEventListener('click', function (ev) {
    var q = posRaton(ev), c = candidataEn(q.x, q.y);
    if (c === null) return;          // ante la duda, no se selecciona nada
    resaltado = c;
    seleccionar(c);
  });
  /* Doble clic: devuelve ESA línea a su original exacto. Vale la misma regla de
     los cruces — sin candidata no hace nada. La candidata se vuelve a calcular
     en la posición del doble clic, así que la línea que se restaura es la que
     está bajo el puntero, que es la que estaba resaltada; y como los dos clics
     previos seleccionan esa misma línea, el doble clic no dispara de paso la
     selección de otra cosa. */
  vistaRed.el.addEventListener('dblclick', function (ev) {
    ev.preventDefault();
    if (!revelado) return;   // antes de revelar no hay valor entrenado que ofrecer
    var q = posRaton(ev), c = candidataEn(q.x, q.y);
    if (c === null) return;
    resaltado = c;
    restaurarUno(c);
  });

  /* ESC suelta la selección. En document, para que llegue por burbujeo también
     con el foco en el deslizador. */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && seleccionado !== null) deseleccionar();
  });

  sincronizarMando();
  redibujar();
}

function fallar(err) {
  var caja = document.createElement('div');
  caja.id = 'fallo';
  caja.textContent = 'La página no arrancó y no se dibujó ningún lienzo.\n\n' + err.message;
  document.getElementById('raiz').appendChild(caja);
}

/* El ancla corre ANTES de crear ningún lienzo. Si lanza, no hay canvas en el
   documento: no se dibuja y se cuenta después, se cuenta y sólo entonces se
   dibuja. */
try {
  ARISTAS = verificarAncla(construirAristas());
  montar();
} catch (err) {
  fallar(err);
  throw err;
}

/* Lo que la página expone para poder verificarse desde fuera. No añade
   comportamiento: son las mismas estructuras que ya usa para dibujar. */
window.EXPL = {
  aristas: ARISTAS, redes: REDES, nombres: NOMBRES, RES: RES,
  geo: GEO,   /* sólo posiciones en pantalla: no sabe nada de índices */
  redActiva: function () { return redActiva; },
  fijarRed: function (c) { redActiva = c; sincronizarMando(); redibujar(); },
  TOL_CAPTURA: TOL_CAPTURA, MARGEN_SEPARACION: MARGEN_SEPARACION,
  RANGO: { min: RANGO_MIN, max: RANGO_MAX, paso: PASO },
  seleccionado: function () { return seleccionado; },
  deseleccionar: deseleccionar,
  resaltado: function () { return resaltado; },
  candidataEn: candidataEn,
  distanciasA: distanciasA,
  distanciaPuntoSegmento: distanciaPuntoSegmento,
  mando: function () { return mando; },
  restaurarTodo: restaurarTodo, aleatorizarTodo: aleatorizarTodo,
  restaurarUno: restaurarUno, tramoNeurona: tramoNeurona,
  nSorteo: function () { return nSorteo; },
  THETA_INICIAL: THETA_INICIAL,
  revelado: function () { return revelado; },
  tocados: function () { return TOCADOS.slice(); },
  UMBRAL_RANURA: UMBRAL_RANURA,
  SEMILLA_BASE: SEMILLA_BASE,
  aPista: aPista,
  redibujar: redibujar,
  lienzoMapa: function () { return vistaMapa; },
  lienzoRed: function () { return vistaRed; },
  maxAbs: maxAbs, evaluar: evaluar, preActivacion: preActivacion,
  reticula: reticula, frontera: frontera, ordenar: ordenar,
  puntos: { train: PUNTOS_TRAIN, test: PUNTOS_TEST }
};

})();
</script>
