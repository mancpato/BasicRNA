'use strict';
/*
Retropropagación paso a paso — red 2→4→1

Es la CUARTA página de BasicRNA y la primera que entrena. Las tres anteriores
no entrenan: el alumno mueve los parámetros a mano y ve qué le pasa a la
frontera. Aquí no se mueve ningún parámetro a mano; se ve cómo los mueve el
algoritmo, uno de un punto a la vez.

La frontera de este directorio, entonces, ya no es «aquí no se entrena» sino
«aquí no se configura». De todos los hiperparámetros se expone UNO, la tasa de
aprendizaje, que es el único cuyo efecto esta animación vuelve visible. Momento,
tamaño de lote e inicialización se quedan en TalleRNA. Si se abrieran aquí, esta
página ya sería TalleRNA y el directorio perdería su límite.

QUÉ PASA EN UN PASO
Se sortea un punto de entrenamiento, se ilumina en el mapa, sus dos coordenadas
entran a la red, activan las cuatro neuronas ocultas, llegan a la salida y
producen una decisión. Se compara con la clase verdadera, y esa diferencia
regresa por la red y ajusta los diecisiete parámetros. Después el mapa, las
cifras y la curva se recalculan. Es un paso de descenso por gradiente
estocástico con una sola muestra, sin momento y sin lote.

LOS DOS RELOJES
Ver un paso en detalle y ver que la red aprende están separados por tres órdenes
de magnitud: con una tasa realista, una actualización mueve un peso en
centésimas, que en el grosor de una línea no se ve. La salida NO son dos modos
distintos sino un solo mecanismo con tres botones: «Un paso» lo anima completo,
y +10 y +100 repiten exactamente el mismo paso con la animación apagada. Lo que
hay que poder explicar es uno solo.

Medido con la inicialización y la semilla que trae este archivo, con eta = 0.05:
ReLU llega a cero mal clasificados en las dos particiones alrededor de la
iteración 1400, y tanh alrededor de la 2400. Son catorce y veinticuatro
apretones de +100. Esa distancia entre el paso que se entiende y la cantidad de
pasos que hacen falta no es un defecto de la página: es la materia.

Al terminar una tanda se APAGA el resalte, en vez de dejarlo en lo que tocó el
último punto. Dejarlo sería señalar un caso particular como si resumiera los
cien.

QUÉ VIAJA DE REGRESO, Y DÓNDE SE PODRÍA MENTIR
Hacia atrás circula δ, la señal de error de cada neurona, que depende del peso.
Lo que cambia cada arista es −eta·δ_j·a_i, que además depende de la activación
que entra por ella. Son dos cantidades distintas sobre la misma arista, y si se
dibujaran con el mismo recurso visual el alumno se llevaría la idea de que el
error corre por el cable y de paso lo modifica. Por eso:

  δ vive en el NODO, como un anillo cuyo grosor es |δ|.
  el ajuste vive en la ARISTA, como un pulso punteado encima de la línea.

El signo del ajuste no puede reusar el azul y el rojo, que ya significan el
signo del peso. Lleva dos colores propios: violeta si el peso sube, ocre si
baja. El presupuesto de color de la página queda así, y conviene no gastarlo
otra vez: azul/rojo el signo del peso, amarillo el nodo de sesgo, azul/naranja
las dos clases, verde la neurona de salida, gris pizarra lo que viaja hacia
adelante, verde azulado δ, violeta/ocre el signo del ajuste.

DÓNDE SE PODRÍA MENTIR, DE VERDAD
El grosor del pulso de ajuste está normalizado CONTRA EL MAYOR AJUSTE DE ESE
MISMO PASO, no contra el tamaño del peso. Tenía que ser así para que se viera
algo: los diecisiete ajustes de un paso valen centésimas o menos. Compara los
ajustes entre sí; no dice que el peso haya cambiado mucho. Está escrito en la
leyenda y hay que decirlo en clase, porque es la única escala de la página que
no es absoluta.

LA GANANCIA QUE SALE GRATIS
Retropropagar multiplica por φ'(z). Con ReLU eso vale 0 o 1, así que una neurona
con z ≤ 0 queda muerta en el paso hacia atrás: no le llega nada y sus cinco
aristas no cambian. Se ve solo, y la página lo rotula con φ'=0 junto al nodo.
Enlaza con la tercera página: el escalón tiene derivada cero en todas partes,
que es por qué TalleRNA le pone la etiqueta ∇=0; aquí se vería como que no
regresa nada por ninguna arista, nunca.

LA CANTIDAD CONTINUA QUE BAJA
Las tres páginas anteriores miden con el contador de mal clasificados, que es
entero y plano. Aquí eso no alcanzaría: actualizando de a un punto, el contador
brinca y a veces empeora, y sin nada al lado el alumno no tendría cómo ver que
aun así se está bajando. Por eso la franja de instrumentos lleva la pérdida
media —la log-verosimilitud negativa por punto, que es exactamente lo que
minimiza el descenso por gradiente— y su curva a lo largo de las iteraciones.
La curva trae marcado 0.693 = ln 2, que es lo que vale decir 50 % a todo: por
encima de esa raya la red todavía no sabe nada.

Conviene decir en clase que el contador y la pérdida pueden discrepar —bajar uno
y subir el otro—, porque eso también es cierto y también es materia.

DÓNDE VA CADA COSA, Y POR QUÉ CABE EN UNA PANTALLA
La página está hecha para proyectarse, así que entra entera en una ventana de
940 px de alto y no se usa el scroll durante la clase. Eso obliga a que nada se
diga dos veces. Las coordenadas del punto viven junto a los nodos de entrada del
diagrama y ŷ junto al de salida, así que el panel del mapa no las repite: ahí va
lo que el diagrama NO dice, que es la clase verdadera, si acertó, y la pérdida
de ese punto al lado de la media de los 160 —dos cifras que conviene ver juntas,
porque un punto puede costar 0.86 mientras la media va en 0.49—.

El rótulo de la fase no es adorno ni repetición: es la explicación hablada del
mecanismo, escrita, y va en el título del panel del mapa, que es donde está
mirando el alumno cuando el punto se ilumina. Lo que sí se quitó es el «paso N
aplicado» de cuando la página está quieta, que ya lo dice el contador de
iteraciones.

Los dos paneles llevan siempre título y dos renglones, llenos o en gris. Con eso
los dos lienzos arrancan a la misma altura sin medir nada y sin que nada salte
al empezar un paso.

EL ANCLA, QUE AQUÍ CRECE
Las tres páginas anteriores descansan en que la línea que se señala sea el
parámetro que se mueve. Aquí la promesa es: LA ARISTA QUE SE ILUMINA ES EL PESO
QUE CAMBIA. Se sostiene igual, con el mismo arreglo de descriptores verificado
antes de crear ningún lienzo, y con una verificación más que las otras no
necesitaban: antes de montar, el gradiente analítico se compara contra
diferencias centradas sobre los diecisiete parámetros, en las dos activaciones.
Si el paso hacia atrás no fuera la derivada de la pérdida, la página no montaría.
Una animación de retropropagación que retropropague otra cosa sería peor que no
tenerla.

LOS PARÁMETROS
  theta[0..3]    pesos de x1 a h1,h2,h3,h4
  theta[4..7]    pesos de x2 a h1,h2,h3,h4
  theta[8..11]   sesgos de h1,h2,h3,h4
  theta[12..15]  pesos de h1,h2,h3,h4 a la salida
  theta[16]      sesgo de la salida
theta[i*NOCULTA + j] es el peso de la entrada i a la neurona oculta j; con el
orden traspuesto sólo coincidirían dos de las ocho aristas de entrada.

LOS DATOS
Son los MISMOS 200 puntos de 2-EditParam.html, un disco alrededor del origen
contra el anillo que lo rodea, partidos en 160 de entrenamiento y 40 de prueba.
Que sean los mismos es deliberado: el alumno viene de intentar a mano estos
puntos con diecisiete parámetros, y aquí ve quién los acomoda.

La inicialización es Xavier con la semilla fija, la misma para las dos
activaciones, así que antes de apretar nada pasar de ReLU a tanh compara la
activación y nada más. Los sesgos empiezan en cero.

Aritmética nativa de JavaScript, binary64. Un solo archivo, sin dependencias,
sin build; se abre con doble clic y dibuja con canvas 2D.

¡Feliz entrenamiento! :-)

Prof. Miguel Ángel Norzagaray Cosío
*/

   dos activaciones. Si el paso hacia atrás no fuera la derivada de la pérdida,

   una frontera enredada al arrancar dice la verdad sobre la red que hay. */

  var cx = 0, cy = 0;
  for (var k = 0; k < P.length; k++) { cx += P[k].x1; cy += P[k].x2; }

  var ys = capas.map(function (n) {
    var v = [];
    for (var i = 0; i < n; i++) v.push(arr + RH * (i + 1) / (n + 1));

    ctx.moveTo(bx, by - T); ctx.lineTo(bx - T, by + T); ctx.lineTo(bx + T, by + T);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6d5b00'; ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('1', bx, by + T + 4);
    ctx.fillStyle = 'rgb(255,220,50)';
  }

  /* Los rótulos y, debajo de cada uno, el número que ese nodo lleva en ESTE
     paso. Aparecen cuando el número existe y no antes. DX los separa lo
     suficiente para que el anillo de δ, que es lo más ancho que se dibuja
     alrededor de un nodo, no llegue a tocarlos. */
  var DX = GEO.RADIO + 16;
  ctx.font = '14px system-ui, sans-serif'; ctx.fillStyle = '#3a434b';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var q2 = 0; q2 < NENT; q2++) ctx.fillText('x' + SUB[q2], GEO.xs[0] - GEO.RADIO - 8, GEO.ys[0][q2]);
  if (hayPaso) {
    ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = 'rgb(' + C_SENAL + ')';
    ctx.textBaseline = 'top';
    for (var q3 = 0; q3 < NENT; q3++)
      ctx.fillText(paso.punto[q3].toFixed(2), GEO.xs[0] - GEO.RADIO - 8, GEO.ys[0][q3] + 6);
  }
  ctx.font = '14px system-ui, sans-serif'; ctx.fillStyle = '#3a434b';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (var h = 0; h < NOCULTA; h++)
    ctx.fillText('h' + SUB[h], GEO.xs[1] + DX, GEO.ys[1][h] - GEO.RADIO - 4);
  ctx.fillText('ŷ', GEO.xs[2] + DX, GEO.ys[2][0] - GEO.RADIO - 4);
  if (verA) {
    ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'top';
    for (var h2 = 0; h2 < NOCULTA; h2++) {
      /* La marca de neurona muerta va EN EL MISMO RENGLÓN que la activación, no
         debajo: debajo de h₄ está el nodo de sesgo y el rótulo caía encima. */
      var txt = 'a=' + paso.a[h2].toFixed(2);
      ctx.fillStyle = 'rgb(' + C_SENAL + ')';
      ctx.fillText(txt, GEO.xs[1] + DX, GEO.ys[1][h2] - GEO.RADIO + 10);
      if (anillosOcultos > 0.6 && muerta[h2]) {
        ctx.fillStyle = 'rgba(' + C_DELTA + ',0.95)';
        ctx.fillText('φ′=0', GEO.xs[1] + DX + ctx.measureText(txt).width + 8,
                     GEO.ys[1][h2] - GEO.RADIO + 10);
      }
    }
  }
  if (verY) {
    ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgb(' + C_SENAL + ')';
    ctx.fillText('ŷ=' + paso.yhat.toFixed(3), GEO.xs[2] + DX, GEO.ys[2][0] - GEO.RADIO + 10);
  }
}

/* ── La curva de la pérdida ────────────────────────────────────────────────
   Es la cantidad continua que baja, que es lo que el contador entero no puede
   ser. Se dibuja entera desde la iteración cero, diezmada a un valor por
   columna de píxel cuando hay más iteraciones que ancho. La raya de ln 2 es el
   ancla de lectura: por encima de ella la red no sabe más que una moneda. */
var CURVA_W = MAPA_L + DIAG_W + 98 - 32 - 470 - 24, CURVA_H = 94;
var LN2 = Math.log(2);
function dibujarCurva(vista, r) {
  var ctx = vista.ctx, k;
  ctx.clearRect(0, 0, vista.w, vista.h);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, vista.w, vista.h);
  var IZQ = 44, DER = 12, ARR = 12, ABA = 22;
  var W = vista.w - IZQ - DER, H = vista.h - ARR - ABA;

  var xmax = Math.max(200, r.iter);
  var ymax = 0;
  for (k = 0; k < r.hist.length; k++) if (r.hist[k] > ymax) ymax = r.hist[k];
  ymax = Math.max(0.8, Math.ceil(ymax * 4) / 4);
  function X(it) { return IZQ + (it / xmax) * W; }
  function Y(L) { return ARR + H - Math.min(1, L / ymax) * H; }

  ctx.strokeStyle = '#c9d0d6'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(IZQ + 0.5, ARR); ctx.lineTo(IZQ + 0.5, ARR + H + 0.5); ctx.lineTo(IZQ + W, ARR + H + 0.5);
  ctx.stroke();

  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(140,150,160,0.9)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(IZQ, Y(LN2)); ctx.lineTo(IZQ + W, Y(LN2)); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#8b959d'; ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('ln 2 — decir 50 % a todo', IZQ + 6, Y(LN2) - 2);

  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(ymax.toFixed(2), IZQ - 6, Y(ymax));
  ctx.fillText('0', IZQ - 6, Y(0));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('0', IZQ, ARR + H + 5);
  ctx.fillText('iteraciones', IZQ + W / 2, ARR + H + 5);
  ctx.textAlign = 'right';
  ctx.fillText(String(xmax), IZQ + W, ARR + H + 5);

  /* Diezmado: un valor por columna, el de esa columna. No es el promedio del
     tramo; es la pérdida real en una iteración real, que es lo que se quiere
     poder leer. */
  ctx.strokeStyle = 'rgb(' + C_SENAL + ')'; ctx.lineWidth = 1.7;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  var paso1 = Math.max(1, Math.ceil(r.hist.length / W)), primero = true;
  for (k = 0; k < r.hist.length; k += paso1) {
    var x = X(k), y = Y(r.hist[k]);
    if (primero) { ctx.moveTo(x, y); primero = false; } else ctx.lineTo(x, y);
  }
  var ux = X(r.iter), uy = Y(r.hist[r.hist.length - 1]);
  ctx.lineTo(ux, uy);
  ctx.stroke();
  ctx.fillStyle = 'rgb(' + C_SENAL + ')';
  ctx.beginPath(); ctx.arc(ux, uy, 3.2, 0, Math.PI * 2); ctx.fill();
}

/* ── Los dos paneles de lectura ────────────────────────────────────────────
   El del punto va con el MAPA, porque el punto es del mapa. El de δ va con el
   DIAGRAMA, porque δ es de la red. Son el mismo paso leído desde los dos
   lados. */
/* HTML colapsa los espacios repetidos, así que el separador entre dos datos de
   un mismo renglón tiene que ser un carácter, no un hueco. */
var SEP = ' <span class="tenue">·</span> ';
function textoPanelPunto() {
  if (paso === null)
    return '<div class="tit">Ningún paso en curso</div>' +
           '<div class="fila mudo">«Un paso» muestra uno completo, en siete tiempos</div>' +
           '<div class="fila mudo">+10 y +100 lo repiten sin animación y sin resaltar nada</div>';
  var p = paso.punto, r = red();
  var s = '<div class="tit">Punto ' + (paso.k + 1) + ' de ' + PUNTOS_TRAIN.length +
          (narracion ? ' <span class="tenue" style="font-weight:400">— ' + narracion + '</span>' : '') + '</div>';
  s += '<div class="fila"><span class="tenue">clase verdadera</span> y = ' + p[2] +
       (fase >= 3 ? SEP + 'ŷ = ' + paso.yhat.toFixed(4) + ' → dice ' + (paso.yhat >= 0.5 ? 1 : 0) +
        ((paso.yhat >= 0.5 ? 1 : 0) === p[2] ? ' <span class="tenue">(acierta)</span>'
                                             : ' <span class="tenue">(falla)</span>')
                  : SEP + '<span class="mudo">ŷ todavía no llega a la salida</span>') + '</div>';
  s += (fase >= 3)
    ? '<div class="fila"><span class="tenue">pérdida de este punto</span> ' + paso.perdida.toFixed(4) +
      SEP + '<span class="tenue">media sobre los ' + PUNTOS_TRAIN.length + '</span> ' +
      r.hist[r.hist.length - 1].toFixed(4) + '</div>'
    : '<div class="fila mudo">la pérdida de este punto se calcula al llegar a la salida</div>';
  return s;
}
function textoPanelDelta() {
  if (paso === null)
    return '<div class="tit">δ y ajuste</div>' +
           '<div class="fila mudo">δ vive en el nodo · el ajuste, en la arista</div>' +
           '<div class="fila mudo">δy = ŷ − y   ·   δh = δy · v · φ′(z)   ·   Δθ = −η · δ · a</div>';
  var s = '<div class="tit">δ y ajuste</div>';
  if (fase >= 4) {
    var t = '<div class="fila">δy = ' + paso.dy.toFixed(4);
    if (fase >= 5) {
      t += '   <span class="dseries">';
      for (var j = 0; j < NOCULTA; j++) {
        var m = ACTS[red().clave].d(paso.z[j], paso.a[j]) === 0;
        t += '<span>δ<b>h' + SUB[j] + '</b> ' + (m ? '0 <span class="tenue">φ′=0</span>' : paso.dh[j].toFixed(4)) + '</span>';
      }
      t += '</span>';
    } else {
      t += SEP + '<span class="mudo">δ todavía no regresa a la capa oculta</span>';
    }
    s += t + '</div>';
  } else {
    s += '<div class="fila mudo">el error todavía no se calcula</div>';
  }
  if (fase >= 6)
    s += '<div class="fila"><span class="tenue">mayor ajuste</span> Δθ = ' +
         paso.d[paso.mayor].toFixed(5) + ' <span class="tenue">en</span> ' + NOMBRES[paso.mayor] +
         SEP + '<span class="tenue">η =</span> ' + paso.eta.toFixed(2) + '</div>';
  else
    s += '<div class="fila mudo">ningún peso ha cambiado todavía</div>';
  return s;
}

/* ── Montaje ───────────────────────────────────────────────────────────────*/
var ARISTAS = null, vistaMapa = null, vistaRed = null, vistaCurva = null;
var nodos = {};

function redibujar() {
  var r = red();
  dibujarMapa(vistaMapa, r);
  dibujarRed(vistaRed, r, ARISTAS);
  dibujarCurva(vistaCurva, r);

  var eTrain = malClasificados(r.theta, r.clave, PUNTOS_TRAIN);
  var eTest = malClasificados(r.theta, r.clave, PUNTOS_TEST);
  var L = r.hist[r.hist.length - 1];
  nodos.cTrain.textContent = eTrain;
  nodos.cTest.textContent = eTest;
  nodos.cPerdida.textContent = L.toFixed(4);
  nodos.cIter.textContent = r.iter;
  nodos.cTrain.className = 'cifra ' + (eTrain === 0 ? 'cero' : 'noCero');
  nodos.cTest.className = 'cifra ' + (eTest === 0 ? 'cero' : 'noCero');
  nodos.panelPunto.innerHTML = textoPanelPunto();
  nodos.panelDelta.innerHTML = textoPanelDelta();
  nodos.panelPunto.className = 'panel' + (paso === null ? ' apagado' : '');
  nodos.panelDelta.className = 'panel' + (paso === null ? ' apagado' : '');
  nodos.pieRed.textContent = (eTrain === 0 && eTest === 0) ? ACTS[r.clave].pie : '';
  Array.prototype.forEach.call(nodos.etiquetas, function (lab) {
    lab.className = (lab.dataset.red === redActiva) ? 'puesto' : '';
  });
}

/* Mientras corre la animación no se puede empezar otra cosa: los botones se
   apagan y la barra dice en qué tiempo va. Es la única vez que la página se
   cierra a la entrada, y dura cuatro segundos y medio. */
function habilitar(puede) {
  ['bPaso', 'b10', 'b100', 'bReiniciar'].forEach(function (id) {
    nodos[id].disabled = !puede;
  });
  Array.prototype.forEach.call(nodos.etiquetas, function (lab) {
    lab.querySelector('input').disabled = !puede;
  });
}

function faseEn(ms) {
  var acc = 0;
  for (var i = 0; i < FASES.length; i++) {
    if (ms < acc + FASES[i].ms) return { i: i, u: (ms - acc) / FASES[i].ms };
    acc += FASES[i].ms;
  }
  return { i: FASES.length - 1, u: 1 };
}

function cuadro(ahora) {
  var ms = ahora - t0;
  var f = faseEn(Math.min(ms, DURACION - 0.001));
  fase = f.i; u = f.u;
  redibujar();
  if (ms < DURACION) { requestAnimationFrame(cuadro); return; }
  /* Fin del paso: AQUÍ se aplican los pesos. Durante toda la animación el
     diagrama mostró los de antes, que son los que produjeron ese ŷ y esas δ. */
  fase = FASES.length - 1; u = 1;
  narracion = 'paso aplicado';
  aplicar(red(), pendiente);
  pendiente = null;
  animando = false;
  habilitar(true);
  redibujar();
}

function unPaso() {
  if (animando) return;
  var r = red();
  var k = sortearPunto(r);
  var s = conAjuste(analizar(r.theta, r.clave, PUNTOS_TRAIN[k]), eta);
  s.k = k;
  paso = s;
  /* Con «reducir movimiento» activado no hay animación: se aplica el paso y se
     muestra su lectura completa, que es lo que la animación deja al final. */
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    fase = FASES.length - 1; u = 1;
    narracion = 'paso aplicado';
    aplicar(r, s);
    redibujar();
    return;
  }
  pendiente = s;
  animando = true;
  habilitar(false);
  fase = 0; u = 0;
  t0 = performance.now();
  requestAnimationFrame(cuadro);
}

function tandaDe(n) {
  if (animando) return;
  tanda(red(), n);
  /* Se apaga el resalte. Dejarlo en el último punto sería señalar un caso
     particular como si resumiera los cien. */
  paso = null; fase = -1; u = 0;
  redibujar();
}

function reiniciar() {
  if (animando) return;
  REDES[redActiva] = nuevaRed(redActiva);
  paso = null; fase = -1; u = 0;
  redibujar();
}

function montar() {

    inp.checked = (clave === redActiva);
    inp.addEventListener('change', function () {
      /* Cada activación conserva SU entrenamiento: sus pesos, sus iteraciones y
         su curva. Cambiar de una a otra no reinicia nada. */
      redActiva = clave;
      paso = null; fase = -1; u = 0;
      redibujar();
    });
    lab.appendChild(inp);
    lab.appendChild(document.createTextNode(ACTS[clave].etiqueta));
    barra.appendChild(lab);
  });

  var d1 = document.createElement('span'); d1.className = 'divisor'; barra.appendChild(d1);

  /* El único hiperparámetro expuesto. Se puede mover a media tanda; lo que no

  slEta.min = ETA_MIN; slEta.max = ETA_MAX; slEta.step = ETA_PASO; slEta.value = ETA_INICIAL;
  var valEta = document.createElement('span');
  valEta.className = 'val'; valEta.textContent = ETA_INICIAL.toFixed(2);
  tasa.appendChild(rotEta); tasa.appendChild(slEta); tasa.appendChild(valEta);
  barra.appendChild(tasa);
  slEta.addEventListener('input', function () {
    eta = parseFloat(slEta.value);
    valEta.textContent = eta.toFixed(2);
  });

  var d2 = document.createElement('span'); d2.className = 'divisor'; barra.appendChild(d2);

  function boton(id, texto, clase) {
    var b = document.createElement('button');
    b.type = 'button'; b.id = id; b.textContent = texto;

  var cifras = document.createElement('div');
  cifras.className = 'cifras';
  /* Cada cifra se arma con nodos y se guarda la referencia, en vez de escribir
     innerHTML y volver a buscarla por id: la referencia no se puede desalinear
     del rótulo que tiene al lado. */
  function par(clase, rotulo, detalle) {
    var caja = document.createElement('div');
    caja.className = 'par';
    var cifra = document.createElement('span');
    cifra.className = 'cifra ' + clase; cifra.textContent = '–';
    var rot = document.createElement('span');
    rot.className = 'rotulo'; rot.textContent = rotulo;
    rot.appendChild(document.createElement('br'));

    de.className = 'de'; de.textContent = detalle;
    rot.appendChild(de);
    caja.appendChild(cifra); caja.appendChild(rot);
    cifras.appendChild(caja);
    return cifra;
  }
  nodos.cTrain = par('noCero', 'mal clasificados', 'de ' + PUNTOS_TRAIN.length + ' entren.');
  nodos.cTest = par('noCero', 'mal clasificados', 'de ' + PUNTOS_TEST.length + ' prueba');
  nodos.cPerdida = par('neutra', 'pérdida media', '−log verosimilitud');
  nodos.cIter = par('neutra', 'iteraciones', 'un punto cada una');
  instr.appendChild(cifras);
  vistaCurva = lienzo(CURVA_W, CURVA_H);
  instr.appendChild(vistaCurva.el);
  raiz.appendChild(instr);

  var tablero = document.createElement('div');
  tablero.className = 'tablero';

  // ── columna del mapa ──
  var cajaMapa = document.createElement('div');
  cajaMapa.className = 'caja';
  cajaMapa.style.width = (MAPA_L + 38) + 'px';
  instr.style.width = (MAPA_L + DIAG_W + 98) + 'px';
  var panelPunto = document.createElement('div');
  panelPunto.className = 'panel apagado';
  panelPunto.id = 'panel-punto';
  cajaMapa.appendChild(panelPunto);
  vistaMapa = lienzo(MAPA_L, MAPA_L);
  cajaMapa.appendChild(vistaMapa.el);
  var legM = document.createElement('div');
  legM.className = 'leyenda';
  legM.innerHTML =
    '<span class="it"><span class="punto" style="background:#4b8bbe"></span>clase 0</span>' +
    '<span class="it"><span class="punto" style="background:#e8825a"></span>clase 1</span>' +
    '<span class="it">● entrenamiento · ✚ prueba</span>' +
    '<span class="it"><span class="marca" style="background:#1c2228"></span>frontera, donde la salida vale 0.5</span>' +
    '<span class="it">intensidad = confianza</span>' +
    '<span class="it">anillo gris = el punto de este paso · anillo de color = la clase que dijo</span>';

  cajaRed.appendChild(vistaRed.el);
  var legR = document.createElement('div');
  legR.className = 'leyenda';
  legR.innerHTML =
    '<span class="it"><span class="marca" style="background:#3c64d2"></span>peso positivo</span>' +
    '<span class="it"><span class="marca" style="background:#d23c3c"></span>peso negativo</span>' +
    '<span class="it">grosor = |θ| contra un tope fijo de ' + ESCALA_GROSOR + '</span>' +
    '<span class="it">▲ = entrada constante 1, el sesgo</span>' +
    '<span class="it"><span class="punto" style="background:#2f3a44"></span>lo que viaja hacia adelante</span>' +
    '<span class="it"><span class="anillo"></span>δ, la señal de error, en el nodo</span>' +
    '<span class="it"><span class="marca" style="background:#7a4fb5"></span>el peso sube</span>' +
    '<span class="it"><span class="marca" style="background:#b07d2b"></span>el peso baja</span>' +
    '<span class="it">grosor del pulso = |Δθ| contra el mayor ajuste de ESTE paso, no contra el tamaño del peso</span>';
  var pieRed = document.createElement('span');
  pieRed.className = 'it';
  legR.appendChild(pieRed);
  cajaRed.appendChild(legR);
  tablero.appendChild(cajaRed);

  raiz.appendChild(tablero);

  nodos.panelPunto = panelPunto;
  nodos.panelDelta = panelDelta;

}

function fallar(err) {
  var caja = document.createElement('div');
  caja.id = 'fallo';
  caja.textContent = 'La página no arrancó y no se dibujó ningún lienzo.\n\n' + err.message;
  document.getElementById('raiz').appendChild(caja);
}

/* Las dos verificaciones corren ANTES de crear ningún lienzo. Si alguna lanza,
   no hay canvas en el documento: no se dibuja y se comprueba después, se
   comprueba y sólo entonces se dibuja. */
try {
  ARISTAS = verificarAncla(construirAristas());
  verificarGradiente();
  montar();
} catch (err) {
  fallar(err);
  throw err;
}

/* Lo que la página expone para poder verificarse desde fuera. No añade
   comportamiento: son las mismas estructuras que ya usa para dibujar. */
window.EXPL = {
  aristas: ARISTAS, nombres: NOMBRES, RES: RES, GEO: GEO,
  NPARAM: NPARAM, NOCULTA: NOCULTA, NENT: NENT,
