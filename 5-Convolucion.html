<div id="raiz"></div>

<script>
'use strict';
/*
Convolución — un filtro 3×3 que recorre la imagen

Es la QUINTA página de BasicRNA y la primera de las dos sobre una red
convolucional. La red ya viene entrenada y aquí no se mueve ningún peso a
mano: el alumno cambia la ENTRADA, pintando su propia imagen o eligiendo una de
la galería, y ve qué hace con ella cada parte de la red. Sobre la red hay un
solo gesto, girar el filtro, que se explica más abajo. La sexta página,
6-BackpropCNN.html, entrena esta misma red.

Con 27 parámetros ya no tiene sentido moverlos a mano, que era el gesto de las
tres primeras páginas. Lo que esta página enseña son las dos ideas que hacen
distinta a una capa convolucional, cada una con su gesto:

  el mismo filtro en todas partes: «Recorrer la imagen» pasea la ventana por las
  dieciséis posiciones con el mismo cuadrito de nueve pesos;
  cada celda mira una zona: señalar una celda del mapa, o su nodo, pone la
  ventana sobre los nueve píxeles de los que sale.

LA RED
Imagen 6×6 → un filtro 3×3 con sesgo b, sin relleno → mapa 4×4 de dieciséis
valores z_p → ReLU → dieciséis nodos a_p → salida ŷ = σ(Σ u_p·a_p + c).
  THETA[0..8]    los nueve pesos del filtro, por renglones
  THETA[9]       b, el sesgo del filtro, el mismo en las dieciséis posiciones
  THETA[10..25]  u_p, el peso del nodo p a la salida
  THETA[26]      c, el sesgo de la salida
La celda p del mapa está en la fila p>>2 y la columna p&3, y su ventana empieza
en ese mismo renglón y esa misma columna de la imagen.

LOS PESOS
Vienen del arnés de medición, fuera del repositorio
(../BasicRNA-trabajo/entrena-cnn/elegir-pesos.js): arranque 50128, ReLU,
η = 0.1, datos estratificados, el vector de la época 58 (llegó a cero errores
en la 8 y siguió 50 más). Se eligió el de mayor confianza mínima —la menor
probabilidad que la red da a la clase correcta entre las 200 imágenes, 0.989—
entre los que tienen TODOS sus parámetros con |θ| ≤ 6. El tope importa por el
dibujo: el grosor de una línea se mide contra 6, como en la página 4, y un peso
mayor se dibujaría al grosor máximo sin distinguirse de los otros.

LOS DATOS
Los genera la página con el mismo generador del arnés, copiado con el mismo
orden de sorteo por imagen, para que la sexta página genere exactamente estas
200 imágenes: semilla 20260928, estratificadas, 80 verticales y 80 horizontales
en las 160 de entrenamiento, 20 y 20 en las 40 de prueba. Antes de montar se
comprueba que los pesos del archivo dan cero errores en las dos particiones;
si no, la página no arranca. El generador guarda además la fila y la columna
donde empieza cada trazo, sin tocar el orden del sorteo: las usa la
verificación del filtro girado.

LO QUE EL ALUMNO HACE
La imagen del diagrama es también el lienzo. Un clic en un píxel lo enciende a
1 o lo apaga a 0 —lo enciende si estaba por debajo de 0.5—, sin intensidades
intermedias: con cero y uno el alumno sabe exactamente qué le dio a la red. Un
clic en una miniatura de la galería la carga; en cuanto se pinta encima, la
miniatura deja de estar seleccionada, porque la imagen ya no es ésa. La página
abre con la primera vertical de la galería cargada, para que el diagrama
arranque con algo que mirar.

LA SALIDA PREGUNTA, NO CLASIFICA
El texto junto a la neurona de salida es «¿Hay un trazo vertical? Sí» o «No»,
con ŷ a dos decimales; con el filtro girado la pregunta es por un trazo
horizontal. Con el filtro sin girar nunca dice «horizontal», aunque la red se
entrenó con verticales contra horizontales: el lienzo vacío no es horizontal, y
la red le contesta que no hay vertical. Medido con estos pesos sobre trazos de 3
píxeles pintados en 1 sobre fondo 0: los 24 horizontales dicen «No», los 16 verticales
de las columnas 1 a 4 dicen «Sí», los 8 verticales pegados a la columna 0 o a
la 5 dicen «No», y el lienzo vacío dice «No». Los de la orilla son invisibles
para esta red: ninguna ventana los tiene bajo su columna central, que es la de
pesos positivos, y la ReLU apaga todas las celdas que los ven. Por eso los datos
nunca ponen un trazo en esas columnas.

GIRAR EL FILTRO
Un clic en el cuadrito del filtro lo gira, y otro lo regresa. En la página se
dice «girar»; en el código es TRASPONER: el peso de la fila i, columna j pasa a
la fila j, columna i. Es la operación que corresponde a trasponer la imagen: el
filtro traspuesto sobre la imagen traspuesta da el mapa traspuesto. Sólo
cambian esos nueve números; b, los dieciséis u_p y c se quedan iguales. Los u_p
no se trasponen, así que la red girada no es exactamente la original vista de
lado; funciona porque los dieciséis u_p son positivos, y cualquier celda
encendida empuja hacia «Sí» esté donde esté. Eso se midió, no se supuso.

La razón del gesto: el filtro es lo que la red busca. Se cambia el filtro y la
misma red busca otra cosa, sin reentrenar. La pregunta de la salida cambia con
él, y con ella la respuesta correcta de cada imagen: los marcos de la galería y
el contador se calculan contra la pregunta vigente.

Con el filtro girado el contador deja de estar en cero, y la página lo dice con
honestidad: los datos no son simétricos. Los trazos verticales nunca tocan las
columnas 0 y 5, pero los horizontales sí tocan las filas 0 y 5, y un trazo en
esas filas nunca queda bajo el renglón central del filtro girado, así que la
ReLU apaga todas las celdas que lo ven, igual que a un vertical pintado en la
columna 0 con el filtro sin girar. Medido con el arnés: 29 errores en las 160 y
9 en las 40, que son exactamente las 38 horizontales de las filas 0 y 5. Con
trazos limpios pintados en 1, las 16 horizontales de las filas 1 a 4 dicen
«Sí», y las 8 de las filas 0 y 5, las 24 verticales y el lienzo vacío dicen
«No». Las dos líneas que lo explican en la página sólo aparecen con el filtro
girado, al pie del diagrama, donde sobra lugar y no mueven nada más.

Antes de montar se verifica que trasponer dos veces devuelve exactamente el
filtro original, y que con el filtro girado las mal clasificadas son EXACTAMENTE
las horizontales cuya fila es 0 o 5, ni una más ni una menos. La primera sola no
bastaría: un espejo izquierda-derecha también se deshace aplicándolo dos veces y
deja el detector vertical como estaba; la segunda lo detecta.

El triángulo de b no tiene gesto: b es del filtro, pero no tiene fila ni columna
que trasponer. Durante el recorrido el filtro no se gira, como no se pinta.

EL DIBUJO, PLANO
Los números los enseña la página 4; aquí casi no hay cifras. Todo valor se
dibuja como tinta sobre papel: más oscuro es mayor, y blanco es cero. Así la
imagen, el mapa y los nodos se leen con la misma regla. En la imagen la tinta es
el valor del píxel, entre 0 y 1. En el mapa y los nodos es a_p contra el mayor
a_p que cualquier imagen con píxeles entre 0 y 1 puede producir con este filtro
—la suma de sus pesos positivos más b—, que es una escala fija; y todo a_p
mayor que cero lleva al menos un 12 % de tinta, para que «casi cero» no se
confunda con «cero». Un cero exacto queda vacío, en blanco: es la ReLU que lo
apagó, y su línea a la salida queda tenue porque no aporta nada.

Los dieciséis nodos van en una columna, en cuatro grupos de cuatro, y cada fila
del mapa tiene una línea punteada a su grupo: aplanar es poner las filas una
debajo de otra, y el nodo p tiene la misma tinta que la celda p.

El filtro es un cuadrito 3×3 aparte, en azul lo positivo y en rojo lo negativo
con la intensidad de |w| contra 6, junto a la flecha que va de la imagen al
mapa. Las dieciséis líneas a la salida llevan grosor √(|u|/6) y el color de su
signo, como en la página 4. Los dos sesgos se dibujan también como en la página
4: un triángulo amarillo, la entrada constante 1, con su línea; el de b entra al
filtro, porque es del filtro y es el mismo en todas las posiciones, y el de c
entra a la salida.

La neurona de salida lleva el color de la clase que decide: naranja si ŷ ≥ 0.5,
que es «Sí», y azul si no.

LO SEÑALADO, EN VERDE
Señalar una celda del mapa o un nodo ilumina en verde la celda, el nodo, su
línea a la salida y la ventana en su lugar de la imagen. Sin nada señalado se
ilumina la celda de mayor a_p, para que la ventana siempre diga de dónde salió
lo más fuerte. Si todas están en cero no se ilumina ninguna, y si el máximo
está empatado tampoco: ante la duda no se elige una, que es la regla de todo el
directorio. Con trazos pintados en 0 y 1 los empates son frecuentes.

RECORRER
Anima la ventana por las dieciséis posiciones en orden de lectura, 110 ms cada
una, llenando la celda y el nodo de cada posición; al final aparece la salida.
Son menos de dos segundos a propósito: lo que se enseña es que el filtro es el
mismo en todas partes, no la aritmética de cada posición. Durante el recorrido
la página no acepta otra entrada. Con «reducir movimiento» se muestra el
resultado sin animar, que es lo que la página ya muestra quieta.

EL ANCLA, AQUÍ
En las páginas anteriores la línea que se señala es el parámetro que se mueve.
Aquí no se mueve ninguno, y la promesa es otra: LO QUE SE ILUMINA JUNTO ES LA
MISMA POSICIÓN p. Celdas, nodos, ventanas y líneas salen de cuatro arreglos de
descriptores que se verifican antes de crear ningún lienzo: los índices de cada
uno son una permutación de 0..15, la ventana de p está en (p>>2, p&3), la celda
de p ocupa ese lugar en el mapa, el nodo de p va en el grupo p>>2, y la línea de
p sale del nodo p y lee THETA[10+p]. Si una celda iluminara la ventana de otra,
la página enseñaría lo contrario de lo que existe para enseñar.

LA GALERÍA
Cada miniatura lleva un marco del color de la respuesta correcta a la pregunta
vigente —naranja «Sí», azul «No»—, como los puntos de las otras páginas llevan
el de su clase, y las de prueba además una cruz, como sus puntos de prueba. Las
páginas 1 a 4 no marcan los puntos mal clasificados uno por uno: ahí el error se
lee contra el color del mapa, que aquí no existe. La marca sale de la página 4,
donde el anillo de color es «la clase que dijo» y dos colores iguales son un
acierto: una miniatura mal clasificada lleva un anillo, fuera de su marco, del
color de lo que contestó la red. Sólo las mal clasificadas lo llevan, así que
no choca con la cruz de prueba, que va dentro. La miniatura cargada lleva en
ese mismo lugar el anillo oscuro de la selección, que gana; su error, si lo
tiene, se lee en la salida del diagrama, que es la misma imagen.

DÓNDE VA CADA COSA
Entra entera en una ventana de 1196 × 940 sin desplazamiento, con el mismo
criterio que la página 4, y ningún dato aparece dos veces: ŷ sólo junto a la
salida, los errores sólo en el contador de la galería. El contador cuenta
contra la pregunta vigente: cero y cero con el filtro sin girar, que es lo que
se verificó al montar, y las horizontales de las filas 0 y 5 con el filtro
girado.

Aritmética nativa de JavaScript, binary64. Un solo archivo, sin dependencias,
sin build; se abre con doble clic y dibuja con canvas 2D.

¡Feliz recorrido! :-)

Prof. Miguel Ángel Norzagaray Cosío
*/

(function () {

/* ── La red y sus pesos ────────────────────────────────────────────────────
   Fijos. Vienen de elegir-pesos.js en el arnés, arranque 50128; el orden es
   [w0..w8, b, u0..u15, c]. */
var NPARAM = 27, NMAPA = 16, I_B = 9, I_U = 10, I_C = 26;
var THETA = [
  -0.9768787679509044, 1.8816155422040584, -0.4049162469269491,
  -1.9389430454128427, 3.275427109185975, -1.831314196746977,
  -2.396575093633489, 3.6766360456338116, -2.0493261029858427,
  -1.4375699788681477, 2.1417110398020465, 1.6828330170456511,
  1.6802547927658482, 2.3563104727442377, 1.2502395945336822,
  1.1668358361055264, 1.744407972647044, 1.3154767748777134,
  1.8533956959873246, 1.6265316557411678, 1.9952537649305584,
  0.8783006208242563, 0.9502431976718317, 1.0154756265443539,
  1.345844595995589, 1.6678567638799573, -5.862904544863303
];

/* El filtro, en sus dos posiciones: tal como se entrenó y traspuesto. Girar el
   filtro es escoger el otro; THETA no se toca. */
function trasponer(w) {
  var t = new Array(9);
  for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) t[3 * i + j] = w[3 * j + i];
  return t;
}
var FILTROS = [THETA.slice(0, 9), trasponer(THETA.slice(0, 9))];
var PREGUNTA = ['vertical', 'horizontal'];

/* Tope contra el que se mide el grosor de una línea y la intensidad de una
   celda del filtro. FIJO y el mismo 6 de las otras páginas, para que un grosor
   quiera decir lo mismo en todas. */
var ESCALA_GROSOR = 6;

/* Duración de cada posición del recorrido. */
var MS_POSICION = 110;

/* ── Los datos ─────────────────────────────────────────────────────────────
   El generador del arnés (entrena-cnn/datos.js, variante estratificada),
   copiado con el mismo orden de sorteo por imagen, que es lo que decide qué
   imagen sale de cada semilla: los 36 píxeles del fondo, la fila y la columna
   donde empieza el trazo, y su intensidad. La clase no se sortea imagen por
   imagen: sale de estratificar, antes. El trazo reemplaza al fondo en sus tres
   píxeles. Una imagen ocupa 36 valores seguidos, por renglones: el píxel
   (r, c) está en r·6 + c. Etiqueta 1 = vertical. Se guardan también la fila y
   la columna donde empieza cada trazo; guardarlas no sortea nada. */
var NTRAIN = 160, NTEST = 40, N = NTRAIN + NTEST;
var SEMILLA_DATOS = 20260928;
var FONDO_MAX = 0.25, TRAZO_MIN = 0.75, TRAZO_MAX = 1.0;

/* El mismo splitmix32 de las otras páginas: aritmética entera de 32 bits con
   Math.imul, exacta, así que la misma semilla da las mismas imágenes en
   cualquier navegador. */
function Sorteador(semilla) { this.s = (semilla >>> 0) || 1; }
Sorteador.prototype.next = function () {
  this.s = (this.s + 0x9e3779b9) >>> 0;
  var z = this.s;
  z = Math.imul(z ^ (z >>> 16), 0x21f0aaad) >>> 0;
  z = Math.imul(z ^ (z >>> 15), 0x735a2d97) >>> 0;
  z = (z ^ (z >>> 15)) >>> 0;
  return z / 4294967296;
};

/* Fisher–Yates sobre un arreglo, en su lugar. */
function barajar(arr, r) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor((i + 1) * r.next());
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* La mitad de cada partición es vertical, en orden mezclado dentro de ella. */
function estratificar(r) {
  var tr = [], te = [], i;
  for (i = 0; i < NTRAIN; i++) tr.push(i < NTRAIN / 2 ? 1 : 0);
  for (i = 0; i < NTEST; i++) te.push(i < NTEST / 2 ? 1 : 0);
  return barajar(tr, r).concat(barajar(te, r));
}

function generarDatos(semilla) {
  var r = new Sorteador(semilla);
  var X = new Float64Array(N * 36), y = new Uint8Array(N);
  var filas = new Uint8Array(N), cols = new Uint8Array(N);
  var fijas = estratificar(r);
  for (var i = 0; i < N; i++) {
    var vertical = fijas[i] === 1;
    y[i] = vertical ? 1 : 0;
    var o = i * 36, p, fila, col;
    for (p = 0; p < 36; p++) X[o + p] = FONDO_MAX * r.next();
    if (vertical) {
      fila = Math.floor(4 * r.next());
      col = 1 + Math.floor(4 * r.next());
    } else {
      fila = Math.floor(6 * r.next());
      col = 1 + Math.floor(2 * r.next());
    }
    filas[i] = fila; cols[i] = col;
    var intensidad = TRAZO_MIN + (TRAZO_MAX - TRAZO_MIN) * r.next();
    for (var t = 0; t < 3; t++) {
      var rr = vertical ? fila + t : fila, cc = vertical ? col : col + t;
      X[o + rr * 6 + cc] = intensidad;
    }
  }
  return { X: X, y: y, fila: filas, col: cols };
}
var DATOS = generarDatos(SEMILLA_DATOS);

/* ── Evaluación ────────────────────────────────────────────────────────────
   Hacia adelante sobre la imagen que empieza en X[o], con el filtro w (nueve
   números) y el resto de THETA. Suma en el mismo orden que el arnés, así que da
   los mismos bits. La salida es SIEMPRE sigmoide y la frontera está donde vale
   0.5. */
function sigmoide(t) {
  var c = Math.min(100, Math.max(-100, t));
  return 1 / (1 + Math.exp(-c));
}
function adelante(X, o, w) {
  var z = new Float64Array(NMAPA), a = new Float64Array(NMAPA), t = THETA[I_C];
  for (var p = 0; p < NMAPA; p++) {
    var pi = p >> 2, pj = p & 3, s = THETA[I_B];
    for (var r = 0; r < 3; r++) {
      var f = o + (pi + r) * 6 + pj;
      s += w[r * 3] * X[f] + w[r * 3 + 1] * X[f + 1] + w[r * 3 + 2] * X[f + 2];
    }
    z[p] = s;
    a[p] = s > 0 ? s : 0;
    t += THETA[I_U + p] * a[p];
  }
  return { z: z, a: a, t: t, yhat: sigmoide(t) };
}
/* La respuesta correcta de la imagen i a la pregunta del filtro g: 1 es «Sí».
   Con el filtro girado la pregunta es por un trazo horizontal. */
function correcta(i, g) { return g ? 1 - DATOS.y[i] : DATOS.y[i]; }
function malClasificados(g) {
  var tr = 0, te = 0, lista = [];
  for (var i = 0; i < N; i++)
    if ((adelante(DATOS.X, i * 36, FILTROS[g]).yhat >= 0.5 ? 1 : 0) !== correcta(i, g)) {
      lista.push(i);
      if (i < NTRAIN) tr++; else te++;
    }
  return { train: tr, test: te, lista: lista };
}

/* El mayor a_p que puede dar una imagen con píxeles entre 0 y 1: todos los
   pesos positivos del filtro sobre píxeles en 1 y los negativos sobre píxeles
   en 0. Es la escala fija de la tinta del mapa y de los nodos, y es la misma
   con el filtro girado, porque trasponer no cambia los nueve números. */
var ESCALA_A = (function () {
  var s = THETA[I_B];
  for (var k = 0; k < 9; k++) if (THETA[k] > 0) s += THETA[k];
  return s;
})();

function verificarPermutacion(nombre, arr) {

/* Con los pesos del archivo, cero errores en las dos particiones de los datos

/* El giro. Trasponer dos veces tiene que devolver exactamente el filtro

/* ── Estado ────────────────────────────────────────────────────────────────*/
var ANCLA = null, ERRORES = null, MAL = null;

  for (var p = 0; p < NMAPA; p++) {

/* ── Dibujo ────────────────────────────────────────────────────────────────*/
var COLOR_CLASE = ['#4b8bbe', '#e8825a'];

/* ── Qué hay bajo el ratón en el diagrama ──────────────────────────────────*/
function pixelEn(px, py) {
  if (px < IMG_X || py < IMG_Y || px >= IMG_X + IMG_L || py >= IMG_Y + IMG_L) return null;
  return Math.floor((py - IMG_Y) / IMG_CEL) * 6 + Math.floor((px - IMG_X) / IMG_CEL);
}
function filtroEn(px, py) {
  return px >= FIL_X && px < FIL_X + FIL_L && py >= FIL_Y && py < FIL_Y + FIL_L;
}
/* La posición p de la celda o del nodo bajo el punto, leída del descriptor.
   El disco de un nodo se toma con 2 px de más; entre dos nodos quedan 2 px que
   no son de ninguno. */
function posicionEn(px, py) {
  var p;
  for (p = 0; p < NMAPA; p++) {
    var c = ANCLA.celdas[p];
    if (px >= c.x && px < c.x + c.lado && py >= c.y && py < c.y + c.lado) return c.p;
  }
  for (p = 0; p < NMAPA; p++) {
    var n = ANCLA.nodos[p];
    if (Math.hypot(px - n.cx, py - n.cy) <= NODO_R + 2) return n.p;
  }
  return null;
}

/* ── Montaje ───────────────────────────────────────────────────────────────*/
var vistaDiag = null, vistaGal = null, nodos = {};

function redibujar() {
  dibujarDiagrama(vistaDiag);
  dibujarGaleria(vistaGal);
  var e = ERRORES[girado];
  nodos.cTrain.textContent = String(e.train);
  nodos.cTrain.className = 'cifra ' + (e.train === 0 ? 'cero' : 'noCero');
  nodos.cTest.textContent = String(e.test);
  nodos.cTest.className = 'cifra ' + (e.test === 0 ? 'cero' : 'noCero');
  nodos.nota.style.display = girado ? '' : 'none';
}

function habilitar(puede) {
  nodos.bBorrar.disabled = !puede;
  nodos.bRecorrer.disabled = !puede;
}

function cargar(i) {
  if (anim) return;
  for (var k = 0; k < 36; k++) imagen[k] = DATOS.X[i * 36 + k];
  galSel = i;
  redibujar();
}
function borrar() {
  if (anim) return;
  imagen.fill(0);
  galSel = null;
  redibujar();
}
function alternar(k) {
  if (anim) return;
  imagen[k] = imagen[k] < 0.5 ? 1 : 0;
  galSel = null;
  redibujar();
}
/* Girar el filtro: escoger el otro de FILTROS. La imagen, lo señalado y la
   miniatura cargada no cambian; cambian el mapa, la salida, la pregunta, los
   marcos y el contador. */
function girar() {
  if (anim) return;
  girado = 1 - girado;
  redibujar();
}

function cuadro(ahora) {
  if (!anim) return;
  var k = Math.floor((ahora - anim.t0) / MS_POSICION);
  if (k >= NMAPA) {
    anim = null;
    habilitar(true);
    redibujar();
    return;
  }
  anim.k = Math.max(0, k);
  redibujar();
  requestAnimationFrame(cuadro);
}
function recorrer() {
  if (anim) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    redibujar();
    return;
  }
  anim = { t0: performance.now(), k: 0 };
  senal = null;
  habilitar(false);
  redibujar();
  requestAnimationFrame(cuadro);
}

function montar() {
  var raiz = document.getElementById('raiz');

  var barra = document.createElement('div');
  barra.className = 'barra';
  var cons = document.createElement('span');
  cons.className = 'consigna';
  cons.textContent = 'Un clic en un píxel de la imagen lo enciende o lo apaga; un clic en una miniatura la carga.';
  barra.appendChild(cons);
  var d1 = document.createElement('span'); d1.className = 'divisor'; barra.appendChild(d1);
  function boton(texto, clase) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = texto;
    if (clase) b.className = clase;
    barra.appendChild(b);
    return b;
  }
  nodos.bBorrar = boton('Borrar la imagen');
  nodos.bRecorrer = boton('Recorrer la imagen', 'principal');
  raiz.appendChild(barra);

  var tablero = document.createElement('div');
  tablero.className = 'tablero';

  // ── el diagrama ──
  var cajaDiag = document.createElement('div');
  cajaDiag.className = 'caja';
  cajaDiag.style.width = (DIAG_W + 38) + 'px';
  vistaDiag = lienzo(DIAG_W, DIAG_H);
  cajaDiag.appendChild(vistaDiag.el);
  var legD = document.createElement('div');
  legD.className = 'leyenda';
  legD.innerHTML =
    '<span class="it">un clic en el filtro lo gira</span>' +
    '<span class="it"><span class="marca" style="background:#3c64d2"></span>peso positivo</span>' +
    '<span class="it"><span class="marca" style="background:#d23c3c"></span>peso negativo</span>' +
    '<span class="it">grosor = |peso| contra un tope fijo de ' + ESCALA_GROSOR + '</span>' +
    '<span class="it">▲ = entrada constante 1, el sesgo</span>' +
    '<span class="it">más oscuro = mayor · vacío = cero, la ReLU lo apagó</span>' +
    '<span class="it">punteado: cada fila del mapa pasa a un grupo de nodos</span>' +
    '<span class="it"><span class="llave" style="border:2px solid rgb(' + VERDE + ')"></span>' +
    'una celda, su nodo, su línea y la ventana que mira; sin señalar nada, la celda mayor</span>';
  cajaDiag.appendChild(legD);
  nodos.nota = document.createElement('div');
  nodos.nota.className = 'nota';
  nodos.nota.innerHTML =
    '<p>El filtro está girado: sólo cambiaron sus nueve números. El sesgo b, los dieciséis pesos a la ' +
    'salida y c son los mismos de antes.</p>' +
    '<p>Se pierden las horizontales de las filas 0 y 5 porque los datos no son simétricos: los trazos ' +
    'verticales nunca tocan las columnas 0 y 5, pero los horizontales sí tocan las filas 0 y 5, y ninguna ' +
    'ventana tiene un trazo de esas filas bajo el renglón central del filtro.</p>';
  cajaDiag.appendChild(nodos.nota);
  tablero.appendChild(cajaDiag);

  // ── la galería, con el contador ──
  var cajaGal = document.createElement('div');
  cajaGal.className = 'caja';
  cajaGal.style.width = (GAL_W + 38) + 'px';
  var cifras = document.createElement('div');
  cifras.className = 'cifras';
  function par(rotulo, detalle) {
    var caja = document.createElement('div');
    caja.className = 'par';
    var cifra = document.createElement('span');
    cifra.className = 'cifra';
    var rot = document.createElement('span');
    rot.className = 'rotulo'; rot.textContent = rotulo;
    rot.appendChild(document.createElement('br'));
    var de = document.createElement('span');
    de.className = 'de'; de.textContent = detalle;
    rot.appendChild(de);
    caja.appendChild(cifra); caja.appendChild(rot);
    cifras.appendChild(caja);
    return cifra;
  }
  nodos.cTrain = par('mal clasificados', 'de ' + NTRAIN + ' entren.');
  nodos.cTest = par('mal clasificados', 'de ' + NTEST + ' prueba');
  cajaGal.appendChild(cifras);
  vistaGal = lienzo(GAL_W, GAL_H);
  cajaGal.appendChild(vistaGal.el);
  var legG = document.createElement('div');
  legG.className = 'leyenda';
  legG.innerHTML =
    '<span class="it"><span class="llave" style="background:#e8825a"></span>Sí</span>' +
    '<span class="it"><span class="llave" style="background:#4b8bbe"></span>No</span>' +
    '<span class="it">✚ prueba</span>' +
    '<span class="it">marco: la respuesta correcta</span>' +
    '<span class="it"><span class="llave" style="background:#e8825a;box-shadow:0 0 0 2px #4b8bbe"></span>' +
    'anillo: mal clasificada, del color que contestó</span>';
  cajaGal.appendChild(legG);
  tablero.appendChild(cajaGal);

  raiz.appendChild(tablero);

  nodos.bBorrar.addEventListener('click', borrar);
  nodos.bRecorrer.addEventListener('click', recorrer);

  function posRaton(vista, ev) {
    var r = vista.el.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (vista.w / r.width), y: (ev.clientY - r.top) * (vista.h / r.height) };
  }
  vistaDiag.el.addEventListener('mousemove', function (ev) {
    if (anim) return;
    var q = posRaton(vistaDiag, ev), p = posicionEn(q.x, q.y);
    vistaDiag.el.style.cursor = (p !== null || pixelEn(q.x, q.y) !== null || filtroEn(q.x, q.y)) ? 'pointer' : 'default';
    if (p !== senal) { senal = p; redibujar(); }
  });
  vistaDiag.el.addEventListener('mouseleave', function () {
    if (senal !== null) { senal = null; redibujar(); }
  });
  vistaDiag.el.addEventListener('click', function (ev) {
    var q = posRaton(vistaDiag, ev), k = pixelEn(q.x, q.y);
    if (k !== null) alternar(k);
    else if (filtroEn(q.x, q.y)) girar();
  });
  vistaGal.el.addEventListener('mousemove', function (ev) {
    var q = posRaton(vistaGal, ev);
    vistaGal.el.style.cursor = (!anim && miniaturaEn(q.x, q.y) !== null) ? 'pointer' : 'default';
  });
  vistaGal.el.addEventListener('click', function (ev) {
    var q = posRaton(vistaGal, ev), i = miniaturaEn(q.x, q.y);
    if (i !== null) cargar(i);
  });

  var primera = 0;
  while (primera < N && DATOS.y[primera] !== 1) primera++;
  cargar(primera);
}

function fallar(err) {
  var caja = document.createElement('div');
  caja.id = 'fallo';
  caja.textContent = 'La página no arrancó y no se dibujó ningún lienzo.\n\n' + err.message;
  document.getElementById('raiz').appendChild(caja);
}

/* Las tres verificaciones corren ANTES de crear ningún lienzo. Si alguna
   lanza, no hay canvas en el documento. */
try {
  ANCLA = verificarAncla(construirCeldas(), construirNodos(), construirVentanas(), construirLineas());
  ERRORES = [verificarPesos(), verificarGiro()];
  MAL = ERRORES.map(function (e) {
    var m = new Uint8Array(N);
    e.lista.forEach(function (i) { m[i] = 1; });
    return m;
  });
  montar();
} catch (err) {
  fallar(err);
  throw err;
}

/* Lo que la página expone para poder verificarse desde fuera. No añade
   comportamiento: son las mismas estructuras que ya usa para dibujar. */
window.EXPL = {
  THETA: THETA, DATOS: DATOS, ANCLA: ANCLA, ERRORES: ERRORES, FILTROS: FILTROS, trasponer: trasponer,
  ESCALA_GROSOR: ESCALA_GROSOR, ESCALA_A: ESCALA_A, MS_POSICION: MS_POSICION,
  SEMILLA_DATOS: SEMILLA_DATOS, generarDatos: generarDatos,
  adelante: adelante, malClasificados: malClasificados,
  imagen: function () { return Array.from(imagen); },
  galSel: function () { return galSel; },
  girado: function () { return girado; },
  yhat: function () { return adelante(imagen, 0, FILTROS[girado]).yhat; },
  posicionIluminada: function () { return posicionIluminada(adelante(imagen, 0, FILTROS[girado])); },
  cargar: cargar, borrar: borrar, alternar: alternar, recorrer: recorrer, girar: girar,
  senalar: function (p) { senal = p; redibujar(); }
};

})();
</script>
</body>
</html>
