'use strict';

/*
Explorador de activaciones — una función por neurona

Se hace clic en una neurona oculta y se elige su función de activación entre
seis; se hace clic en una conexión y se mueve su peso o su sesgo con el
deslizador. Las cuatro neuronas ocultas pueden llevar funciones distintas, que
es lo que esta página existe para enseñar. Se puede pedir una solución, pero
este ejercicio no es de entrenamiento: es de exploración.

En clase debe explicarse que la costumbre de poner una capa entera con la misma
activación es una conveniencia de implementación —una capa homogénea es una
sola operación sobre un tensor— y no una ley; y que con una sola capa oculta la
salida es una SUMA PESADA de cuatro funciones de una proyección lineal, así que
cada neurona aporta una forma al mapa y esa aportación se puede aislar apagando
las otras tres. Con dos capas ocultas eso deja de ser cierto y la atribución se
pierde.

Es la página SIGUIENTE a 2-EditParam.html, que tiene la misma red
2→4→1 con una activación para toda la capa, elegida con un interruptor. Allá el
alumno mueve diecisiete parámetros con la forma de la neurona ya decidida; aquí
la forma también se decide, y se decide neurona por neurona. La progresión de
las tres páginas es una sola: en 1-Perceptron.html cada parámetro hace
algo que se dice en una frase, en la segunda ya son diecisiete y la intuición no
alcanza, y en ésta lo que se elige no es un número sino una forma.

QUÉ ES LA PÁGINA
Una red 2→4→1 con salida sigmoide y tres conjuntos de puntos para probarla. A la
izquierda, lo que la red predice en cada punto del cuadrado; a la derecha, el
diagrama: diecisiete líneas, una por parámetro, y cuatro nodos ocultos, cada uno
con el dibujo de su activación en el centro. La página abre con pesos al azar y
las cuatro neuronas en ReLU, que es la red convencional con la que se llegó
desde la página anterior.

Las seis activaciones no son un catálogo de fórmulas sino una casilla cada una,
y la casilla se ve en el mapa. Con una sola capa oculta cada neurona aporta una
función de w·x+b, constante a lo largo de las rectas perpendiculares a w, así
que lo único que puede cambiar de una neurona a otra es cuántas franjas aporta y
de qué clase:
  lineal      ninguna frontera propia; cuatro lineales son una sola recta
  escalón     una recta con salto: mesetas planas en vez de rampas
  ReLU        una recta y un doblez
  tanh        una recta difuminada
  gaussiana   una banda, o sea dos rectas
  seno        bandas repetidas, sin límite
Casi todo el catálogo usual —sigmoide, softplus, ELU, leaky ReLU, SiLU, GELU—
cae en la misma casilla que tanh: cambian el difuminado del borde y nada más.
Por eso no están: alargarían el menú sin agregar un fenómeno.

Parámetros
  theta[0..3]    pesos de x1 a h1,h2,h3,h4
  theta[4..7]    pesos de x2 a h1,h2,h3,h4
  theta[8..11]   sesgos de h1,h2,h3,h4
  theta[12..15]  pesos de h1,h2,h3,h4 a la salida
  theta[16]      sesgo de la salida
Y, aparte del vector, un arreglo de cuatro nombres de activación, uno por
neurona oculta.

EL ANCLA, EN SUS DOS MITADES
La línea que se señala es el parámetro que se mueve, y el nodo que se señala es
la activación que cambia. La primera mitad descansa en el orden
theta[i*NOCULTA + j]: con el orden traspuesto, j*NENT + i, de las ocho aristas
de entrada sólo coinciden dos y las otras seis se dibujarían con el grosor de
otro peso.

La segunda mitad es más frágil, y conviene saber por qué. Para las líneas el
vínculo viaja por un solo número; para los nodos hay dos travesías, del clic al
índice de neurona y del índice a la casilla del arreglo de activaciones. Y los
cuatro nodos son círculos iguales en la misma columna, así que una permutación
entre ellos no rompe nada, no dibuja nada torcido y no lanza ningún error: se
cambiaría la activación de h2 y se movería la del mapa que produce h3. Por eso
el glifo y la evaluación leen EL MISMO arreglo, sin copias, y por eso hay una
prueba en la hoja de apoyo: poner las cuatro en lineal menos una, y ésa en
gaussiana; el mapa queda con una sola banda, y la banda tiene que ser
perpendicular a la dirección del peso de la neurona que se señaló.

LOS TRES CONJUNTOS DE PUNTOS
Todos de 200 puntos en [-1,1]^2, partidos en 160 de entrenamiento y 40 de
prueba, y todos con una holgura entre clases para que el cero de errores sea
alcanzable a mano. Se eligieron midiendo, no de oído: para cada conjunto y cada
activación se buscó el mínimo de neuronas que llega a cero errores, con el
presupuesto de cuatro que tiene la red.

  banda      lineal —   escalón 2   ReLU 2   tanh 2   gaussiana 1   seno 1
  círculos   lineal —   escalón 3   ReLU 3   tanh 3   gaussiana 2   seno 2
  franjas    lineal —   escalón —   ReLU —   tanh —   gaussiana —   seno 1

La banda es la entrada: una gaussiana sola basta, porque una banda es
exactamente lo que una gaussiana aporta, mientras que ReLU necesita dos para
fabricarla con dos rectas. Los círculos son los MISMOS puntos de
2-EditParam.html, para que el alumno llegue con el tablero conocido y
descubra que lo que allá le costó diecisiete parámetros aquí sale con dos
neuronas. Las franjas son el que decide: la clase es el signo de sin(10·x1), o
sea siete regiones dentro del cuadrado, y cuatro dobleces no hacen siete
regiones por mucho que se muevan; una sola neurona seno llega a cero.

El recorrido del deslizador es ±12 y no ±6 como en la página anterior, y la
razón es el seno: la frecuencia de las franjas vive en el peso, y con tope 6 no
hay manera de escribir sin(10·x1). Los pesos del sorteo inicial sí se reparten
en ±6, para que la página no abra con valores extremos.

Las tres soluciones que enseña el botón están horneadas y verificadas: cero mal
clasificados en las dos particiones de su conjunto. La del seno no se buscó, se
escribió: peso 10 sobre x1, sesgo 0, peso de salida 4, y el resto en cero.

Aritmética nativa de JavaScript, binary64. La retícula del mapa es de 50x50 y la
frontera se traza por cambio de signo entre celdas vecinas. Un solo archivo, sin
dependencias, sin build; se abre con doble clic y dibuja con canvas 2D.

¡Feliz exploración! :-)

Prof. Miguel Ángel Norzagaray Cosío
*/

/* ── El glifo de la activación ─────────────────────────────────────────────

      else if (cual === 'sigmoide') y = (cy + B) - (1 / (1 + Math.exp(-t))) * 2 * B;
      else y = cy - Math.sin(t) * B;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }
  ctx.stroke();
  ctx.restore();
}

var MAPA_L = 520, MARCO = 32;
function aPixel(x1, x2) {
  var p = MARCO, lado = MAPA_L - 2 * MARCO;
  return { px: p + (x1 + 1) / 2 * lado, py: p + (1 - (x2 + 1) / 2) * lado };
}

function dibujarMapa(vista, th, actos) {
  var ctx = vista.ctx, lado = MAPA_L - 2 * MARCO;
  var TRAIN = problema().train, TEST = problema().test;
  ctx.clearRect(0, 0, vista.w, vista.h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, vista.w, vista.h);

  var g = reticula(th, actos);
  var cel = lado / RES;
  for (var i = 0; i < RES; i++) for (var j = 0; j < RES; j++) {
    var yhat = g[i * RES + j];
    var alfa = Math.abs(yhat - 0.5) * 2 * 180 / 255;
    ctx.fillStyle = (yhat < 0.5 ? 'rgba(75,139,190,' : 'rgba(232,130,90,') + alfa.toFixed(4) + ')';
    // los dos bordes se redondean al mismo entero que el de la celda vecina:
    // solapar un pelo deja juntas visibles y convierte el mapa en una rejilla
    var cx0 = Math.round(MARCO + j * cel), cx1 = Math.round(MARCO + (j + 1) * cel);
    var cy0 = Math.round(MARCO + i * cel), cy1 = Math.round(MARCO + (i + 1) * cel);
    ctx.fillRect(cx0, cy0, cx1 - cx0, cy1 - cy0);
  }

  ctx.strokeStyle = '#c9d0d6'; ctx.lineWidth = 1;
  ctx.strokeRect(MARCO + 0.5, MARCO + 0.5, lado - 1, lado - 1);
  ctx.strokeStyle = '#aeb7bf';
  var o = aPixel(0, 0), a0 = aPixel(-1, 0), a1 = aPixel(1, 0), b0 = aPixel(0, -1), b1 = aPixel(0, 1);
  ctx.beginPath();
  ctx.moveTo(a0.px, o.py); ctx.lineTo(a1.px, o.py);
  ctx.moveTo(o.px, b0.py); ctx.lineTo(o.px, b1.py);
  ctx.stroke();
  ctx.fillStyle = '#6d777f'; ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (var v = -1; v <= 1.001; v += 0.5) {
    var vr = Math.round(v * 10) / 10;
    if (Math.abs(vr) < 0.01) continue;
    var t1 = aPixel(vr, 0), t2 = aPixel(0, vr);
    ctx.beginPath(); ctx.moveTo(t1.px, o.py - 4); ctx.lineTo(t1.px, o.py + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.px - 4, t2.py); ctx.lineTo(o.px + 4, t2.py); ctx.stroke();
    ctx.fillText(vr.toFixed(1), t1.px, o.py + 6);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(vr.toFixed(1), o.px - 6, t2.py);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  }
  ctx.fillStyle = '#3a434b'; ctx.font = '13px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('x₁', a1.px + 7, o.py);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('x₂', o.px, b1.py - 7);

  // la frontera, como puntos sueltos — ver el comentario de ordenar/frontera
  var P = frontera(g);
  ctx.fillStyle = 'rgba(28,34,40,0.85)';
  for (var k = 0; k < P.length; k++) {
    var q = aPixel(P[k].x1, P[k].x2);
    ctx.fillRect(q.px - 1.1, q.py - 1.1, 2.2, 2.2);
  }

  // los datos: entrenamiento en círculo, prueba en cruz
  for (var d = 0; d < TRAIN.length; d++) {
    var pt = TRAIN[d], pp = aPixel(pt[0], pt[1]);
    ctx.fillStyle = COLOR_CLASE[pt[2]];
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pp.px, pp.py, 4.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  var BRAZO = 5;
  ctx.lineWidth = 2.3;
  for (var e = 0; e < TEST.length; e++) {
    var qt = TEST[e], qq = aPixel(qt[0], qt[1]);
    ctx.strokeStyle = COLOR_CLASE[qt[2]];
    ctx.beginPath();
    ctx.moveTo(qq.px - BRAZO, qq.py); ctx.lineTo(qq.px + BRAZO, qq.py);
    ctx.moveTo(qq.px, qq.py - BRAZO); ctx.lineTo(qq.px, qq.py + BRAZO);
    ctx.stroke();
  }
}

/* El diagrama. El grosor sale de theta[a.idx] y de nada más: si el descriptor
   apuntara a otro parámetro, la línea engordaría en otro sitio.

   Y se mide contra el TOPE DEL DESLIZADOR, no contra el mayor |θ| de los
   diecisiete actuales. Con el normalizador móvil —que es como estaba, heredado
   de 2-EditParam.html— arrastrar el parámetro más grande cambiaba el
   grosor y la opacidad de las otras dieciséis líneas solas: mientras ese
   parámetro fuera el máximo, el normalizador viajaba con él. En esta página eso
   rompe el ancla, que promete que la línea señalada es la que se mueve y ninguna
   más. Con el tope fijo, el mismo valor se dibuja siempre igual y los grosores
   son comparables entre un momento y otro y entre los tres conjuntos.

   La raíz está por resolución en el extremo chico: con el cociente directo
   contra 12, θ = 0.1 y θ = 0.5 saldrían a 1.07 y 1.37 px y serían el mismo
   pelo; con la raíz salen a 1.8 y 2.8 px. */
function dibujarRed(vista, th, actos, aristas, nds, resalte, selec, nodoResaltado) {
  var ctx = vista.ctx;
  ctx.clearRect(0, 0, vista.w, vista.h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, vista.w, vista.h);

  var porIdx = {};
  for (var m = 0; m < aristas.length; m++) porIdx[aristas[m].idx] = aristas[m];
  /* Reciben el VALOR del parámetro, no el descriptor de la arista. Ninguna de
     las dos mira el resto del vector: ahí está todo el arreglo. */
  function fuerza(v) { return Math.sqrt(Math.min(Math.abs(v) / RANGO_MAX, 1)); }
  function grosorDe(v) { return 1 + fuerza(v) * 9; }

  ctx.lineCap = 'round';
  /* Los halos van DEBAJO de todas las líneas: así ninguno tapa a su vecina. */
  [{ i: selec,   color: 'rgba(140,90,200,0.55)', mas: 15 },
   { i: resalte, color: 'rgba(90,105,120,0.32)', mas: 9  }].forEach(function (h) {
    if (h.i === null || h.i === undefined || !porIdx[h.i]) return;
    var a = porIdx[h.i];
    ctx.lineWidth = grosorDe(th[a.idx]) + h.mas;
    ctx.strokeStyle = h.color;
    ctx.beginPath(); ctx.moveTo(a.ax, a.ay); ctx.lineTo(a.bx, a.by); ctx.stroke();
  });

  for (var n = 0; n < aristas.length; n++) {
    var a = aristas[n], w = th[a.idx];
    var t = fuerza(w);
    /* El resaltado engorda y gana opacidad, pero NO cambia de color: el color
       codifica el signo y no puede querer decir dos cosas. */
    var realce = (a.idx === resalte) ? 2.5 : 0;
    var opac = (a.idx === resalte || a.idx === selec) ? Math.min(1, 0.55 + t * 0.45) : 0.28 + t * 0.7;
    ctx.lineWidth = grosorDe(w) + realce;
    ctx.strokeStyle = (w >= 0 ? 'rgba(60,100,210,' : 'rgba(210,60,60,') + opac.toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(a.ax, a.ay); ctx.lineTo(a.bx, a.by); ctx.stroke();
  }

  /* Los nodos. Los ocultos llevan el glifo de SU activación, leída de actos por
     el índice del descriptor; el de salida lleva siempre el de la sigmoide,
     porque su activación no se elige. Las entradas no llevan glifo, y esa
     ausencia significa algo: no tienen activación. */
  for (var c = 0; c < GEO.capas.length; c++) {
    var idc = c === 0 ? 0 : (c === GEO.capas.length - 1 ? 2 : 1);
    for (var i = 0; i < GEO.capas[c]; i++) {
      ctx.fillStyle = COLOR_NODO[idc]; ctx.strokeStyle = BORDE_NODO[idc]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(GEO.xs[c], GEO.ys[c][i], GEO.RADIO, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      if (c === GEO.capas.length - 1) glifoActivacion(ctx, GEO.xs[c], GEO.ys[c][i], 'sigmoide', 1);
    }
  }
  for (var q = 0; q < nds.length; q++) {
    var nd = nds[q];
    if (nd.j === nodoResaltado) {
      ctx.strokeStyle = 'rgba(140,90,200,0.75)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(nd.cx, nd.cy, GEO.RADIO + 4, 0, Math.PI * 2); ctx.stroke();
    }
    glifoActivacion(ctx, nd.cx, nd.cy, actos[nd.j], 1);
  }

  // nodos de sesgo: triángulo. No tienen activación, así que no llevan glifo.
  ctx.fillStyle = 'rgb(255,220,50)'; ctx.strokeStyle = 'rgb(180,150,0)'; ctx.lineWidth = 2;
  for (var s = 0; s < GEO.xBias.length; s++) {
    var bx = GEO.xBias[s], by = GEO.yBias[s], T = GEO.TB;
    ctx.beginPath();
    ctx.moveTo(bx, by - T); ctx.lineTo(bx - T, by + T); ctx.lineTo(bx + T, by + T);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6d5b00'; ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('1', bx, by + T + 4);
    ctx.fillStyle = 'rgb(255,220,50)';
  }

  ctx.font = '14px system-ui, sans-serif'; ctx.fillStyle = '#3a434b';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var qq = 0; qq < NENT; qq++) ctx.fillText('x' + SUB[qq], GEO.xs[0] - GEO.RADIO - 8, GEO.ys[0][qq]);
  ctx.textAlign = 'left';
  for (var h2 = 0; h2 < NOCULTA; h2++)
    ctx.fillText('h' + SUB[h2], GEO.xs[1] + GEO.RADIO + 8, GEO.ys[1][h2] - GEO.RADIO - 2);
  ctx.fillText('ŷ', GEO.xs[2] + GEO.RADIO + 8, GEO.ys[2][0]);
}

/* ── Selección con el ratón ────────────────────────────────────────────────
   Las 17 líneas convergen en los nodos, y cerca de uno hay hasta cinco a pocos
   píxeles unas de otras. Señalar la equivocada es el peor fallo posible aquí,
   porque el alumno creería estar moviendo un parámetro mientras mueve otro.
   La regla es: ANTE LA DUDA NO SE SELECCIONA NADA.

   El disco del nodo se prueba PRIMERO y gana siempre. No hace falta excluir
   además una banda vertical alrededor de la columna: las aristas terminan en el
   centro del nodo, así que dentro de esa banda y lejos de una neurona no pasa
   ninguna línea, y lo que la banda excluiría de más es lienzo vacío. Y el
   interior del disco ya era inerte antes de que hubiera menú, por la regla de
   la duda: ahí todas las líneas que llegan están a la misma distancia. */
function distanciaPuntoSegmento(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  var t = (L2 === 0) ? 0 : ((px - ax) * dx + (py - ay) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  var qx = ax + t * dx, qy = ay + t * dy;
  return Math.hypot(px - qx, py - qy);
}
/* Distancias a los 17 segmentos, ordenadas. Se usan SÓLO las posiciones de los
   nodos en pantalla, nunca el grosor dibujado: el blanco de un parámetro no
   puede depender de su valor. */
function distanciasA(px, py) {
  var d = [];
  for (var n = 0; n < ARISTAS.length; n++) {
    var a = ARISTAS[n];
    d.push({ idx: a.idx, d: distanciaPuntoSegmento(px, py, a.ax, a.ay, a.bx, a.by) });
  }
  d.sort(function (p, q) { return p.d - q.d; });
  return d;
}
/* Hay candidata sólo si se cumplen las TRES: la más cercana cae dentro de la
   tolerancia, la siguiente está al menos al doble de distancia, y la siguiente
   está además a MARGEN_SEPARACION píxeles de la primera. */
function candidataEn(px, py) {
  var d = distanciasA(px, py);
  if (d[0].d > TOL_CAPTURA) return null;
  if (d[1].d < 2 * d[0].d) return null;
  if (d[1].d - d[0].d < MARGEN_SEPARACION) return null;
  return d[0].idx;
}
/* El nodo bajo el punto, o null. Devuelve el ÍNDICE DE NEURONA del descriptor,
   nunca una posición en el arreglo de dibujo. */
function nodoEn(px, py) {
  for (var k = 0; k < NODOS.length; k++) {
    var n = NODOS[k];
    if (Math.hypot(px - n.cx, py - n.cy) <= GEO.RADIO) return n.j;
  }
  return null;
}

/* ── Montaje ───────────────────────────────────────────────────────────────*/
var ARISTAS = null, NODOS = null, vistaMapa = null, vistaRed = null, envoltura = null;
var cont = {}, mando = {};
var seleccionado = null;      /* índice en theta, o null */
var resaltado = null;         /* la candidata bajo el ratón, o null */
var nodoResaltado = null;     /* la neurona bajo el ratón, o null */
var menuAbierto = null;       /* el elemento del menú, o null */
var origenPresion = null;     /* dónde empezó la última presión del ratón */

function redibujar() {
  dibujarMapa(vistaMapa, theta, ACTOS);
  dibujarRed(vistaRed, theta, ACTOS, ARISTAS, NODOS, resaltado, seleccionado, nodoResaltado);
  var eTr = malClasificados(theta, ACTOS, problema().train);
  var eTe = malClasificados(theta, ACTOS, problema().test);
  var nu = neuronasEnUso(theta);
  cont.tren.textContent = eTr;
  cont.tren.className = 'cifra ' + (eTr === 0 ? 'cero' : 'noCero');
  cont.prueba.textContent = eTe;
  cont.prueba.className = 'cifra ' + (eTe === 0 ? 'cero' : 'noCero');
  cont.deTren.textContent = 'de ' + problema().train.length + ' de entrenamiento';
  cont.dePrueba.textContent = 'de ' + problema().test.length + ' de prueba';
  cont.usadas.textContent = nu;
  cont.pie.textContent = problema().pie;
}

function aPista(v) {
  var util = PISTA_W - POMO;
  return POMO / 2 + (v - RANGO_MIN) / (RANGO_MAX - RANGO_MIN) * util;
}
function actualizarLectura() {
  if (seleccionado === null) { mando.val.textContent = '—'; return; }
  mando.val.textContent = (theta[seleccionado] >= 0 ? '+' : '') + theta[seleccionado].toFixed(2);
}
function sincronizarMando() {
  var hay = seleccionado !== null;
  mando.caja.className = 'mando' + (hay ? '' : ' apagado');
  mando.rot.className = 'mando-rot' + (hay ? '' : ' vacio');
  mando.rot.textContent = hay ? NOMBRES[seleccionado]
    : 'Haz clic en una conexión para moverla, o en una neurona para cambiar su función';
  mando.val.className = 'mando-val' + (hay ? '' : ' nada');
  mando.slider.disabled = !hay;
  if (hay) mando.slider.value = String(theta[seleccionado]);
  actualizarLectura();
}

function registrarTocado(idx) {
  if (TOCADOS.indexOf(idx) === -1) TOCADOS.push(idx);
  if (!ranuraAbierta && TOCADOS.length >= UMBRAL_RANURA) abrirRanura();
}
function abrirRanura() {
  if (ranuraAbierta) return;
  ranuraAbierta = true;
  mando.ranura.textContent = '';
  mando.ranura.appendChild(mando.botonSol);
  mando.ranura.appendChild(mando.botonAzar);
  mando.ranura.appendChild(mando.botonReinicio);
}

function seleccionar(idx) {
  cerrarMenu();
  seleccionado = idx;
  sincronizarMando();
  redibujar();
}
function deseleccionar() {
  seleccionado = null;
  sincronizarMando();
  redibujar();
}

/* ── El menú de activaciones ───────────────────────────────────────────────
   Cada renglón dibuja su glifo con la MISMA función que dibuja el nodo, en un
   disco del mismo color: el renglón enseña exactamente cómo va a quedar la
   neurona. */
function cerrarMenu() {
  if (menuAbierto) { menuAbierto.parentNode.removeChild(menuAbierto); menuAbierto = null; }
}
function abrirMenu(j) {
  cerrarMenu();
  var caja = document.createElement('div');
  caja.className = 'menu';
  var cab = document.createElement('div');
  cab.className = 'cab';
  cab.textContent = 'función de h' + SUB[j];
  caja.appendChild(cab);

  ACTIVACIONES.forEach(function (a) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'op' + (ACTOS[j] === a.clave ? ' puesta' : '');
    var v = lienzo(30, 30);
    v.ctx.fillStyle = COLOR_NODO[1];
    v.ctx.strokeStyle = BORDE_NODO[1];
    v.ctx.lineWidth = 2;
    v.ctx.beginPath(); v.ctx.arc(15, 15, 13, 0, Math.PI * 2); v.ctx.fill(); v.ctx.stroke();
    glifoActivacion(v.ctx, 15, 15, a.clave, 1);
    b.appendChild(v.el);
    var t = document.createElement('span');
    t.textContent = a.etiqueta;
    b.appendChild(t);
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      ponerActivacion(j, a.clave);
    });
    caja.appendChild(b);
  });

  /* Se coloca al lado del nodo, y se recorta contra el alto del lienzo para que
     no se salga por abajo con h4. */
  var ARRIBA = 26;
  var top = GEO.ys[1][j] - ARRIBA;
  caja.style.left = (GEO.xs[1] + GEO.RADIO + 12) + 'px';
  caja.style.top = top + 'px';
  envoltura.appendChild(caja);
  var sobra = (caja.offsetTop + caja.offsetHeight) - DIAG_H;
  if (sobra > 0) caja.style.top = Math.max(0, top - sobra) + 'px';
  menuAbierto = caja;
}
function ponerActivacion(j, clave) {
  ACTOS[j] = clave;
  cerrarMenu();
  abrirRanura();   // cambiar una activación ya es haber hecho la pregunta
  redibujar();
}

function restaurarTodo() {
  theta = THETA_INICIAL.slice();
  ACTOS = ACTOS_INICIAL.slice();
  cerrarMenu();
  sincronizarMando();
  redibujar();
}
function mostrarSolucion() {
  var s = problema().sol;
  theta = s.theta.slice();
  ACTOS = s.act.slice();
  cerrarMenu();
  sincronizarMando();
  redibujar();
}
function aleatorizarTodo() {
  nSorteo++;
  var rng = new Sorteador(SEMILLA_BASE + nSorteo), v = [];
  for (var k = 0; k < NPARAM; k++) {
    var u = SORTEO_MIN + rng.next() * (SORTEO_MAX - SORTEO_MIN);
    v.push(Math.round(u / PASO) * PASO);
  }
  theta = v;
  cerrarMenu();
  sincronizarMando();
  redibujar();
}

function montar() {
  var raiz = document.getElementById('raiz');

  /* La barra: los tres conjuntos, y a la derecha la ranura con la consigna o
     con los botones. */

    r.addEventListener('change', function () {

    lab.appendChild(document.createTextNode(p.etiqueta));
    barra.appendChild(lab);
    etiquetas.push(lab);
  });
  var div = document.createElement('div');
  div.className = 'divisor';
  barra.appendChild(div);
  mando.ranura = document.createElement('div');
  mando.ranura.className = 'ranura';
  var cons = document.createElement('span');
  cons.className = 'consigna';
  cons.textContent = 'Mueve cuatro parámetros, o cambia una función, y aparecerán los botones.';
  mando.ranura.appendChild(cons);
  barra.appendChild(mando.ranura);
  raiz.appendChild(barra);

  mando.botonSol = document.createElement('button');
  mando.botonSol.type = 'button';
  mando.botonSol.textContent = 'Mostrar una solución';
  mando.botonSol.addEventListener('click', mostrarSolucion);
  mando.botonAzar = document.createElement('button');
  mando.botonAzar.type = 'button';
  mando.botonAzar.textContent = 'Valores al azar';
  mando.botonAzar.addEventListener('click', aleatorizarTodo);
  mando.botonReinicio = document.createElement('button');
  mando.botonReinicio.type = 'button';
  mando.botonReinicio.textContent = 'Reiniciar';
  mando.botonReinicio.addEventListener('click', restaurarTodo);

  var tablero = document.createElement('div');
  tablero.className = 'tablero';
  raiz.appendChild(tablero);

  /* Caja izquierda: contador y mapa. */
  var cajaMapa = document.createElement('div');
  cajaMapa.className = 'caja';
  var marcador = document.createElement('div');
  marcador.className = 'contador';
  function par(claseCifra, rotulo) {
    var d = document.createElement('div');
    d.className = 'par';
    var c = document.createElement('span');
    c.className = 'cifra ' + claseCifra;
    var r = document.createElement('span');
    r.className = 'rotulo';
    r.textContent = rotulo;
    d.appendChild(c); d.appendChild(r);
    marcador.appendChild(d);
    return { cifra: c, rotulo: r };
  }
  var p1 = par('noCero', '');
  var p2 = par('noCero', '');
  var p3 = par('neutro', 'neuronas en uso, de 4');
  cont.tren = p1.cifra; cont.deTren = p1.rotulo;
  cont.prueba = p2.cifra; cont.dePrueba = p2.rotulo;
  cont.usadas = p3.cifra;
  cajaMapa.appendChild(marcador);
  vistaMapa = lienzo(MAPA_L, MAPA_L);
  cajaMapa.appendChild(vistaMapa.el);
  var leyMapa = document.createElement('div');
  leyMapa.className = 'leyenda';
  leyMapa.innerHTML =
    '<span class="it"><span class="punto" style="background:#4b8bbe"></span>clase 0</span>' +
    '<span class="it"><span class="punto" style="background:#e8825a"></span>clase 1</span>' +
    '<span class="it">círculo: entrenamiento · cruz: prueba</span>' +
    '<span class="it">los puntos negros son la frontera, donde la salida vale 0.5</span>';
  cajaMapa.appendChild(leyMapa);
  cont.pie = document.createElement('div');
  cont.pie.className = 'leyenda';
  cajaMapa.appendChild(cont.pie);
  tablero.appendChild(cajaMapa);

  /* Caja derecha: mando y diagrama. */
  var cajaRed = document.createElement('div');
  cajaRed.className = 'caja';
  mando.caja = document.createElement('div');
  mando.caja.className = 'mando apagado';
  var cab = document.createElement('div');
  cab.className = 'mando-cab';
  mando.rot = document.createElement('span');
  mando.rot.className = 'mando-rot vacio';
  mando.val = document.createElement('span');
  mando.val.className = 'mando-val nada';
  cab.appendChild(mando.rot); cab.appendChild(mando.val);
  mando.caja.appendChild(cab);

  var pista = document.createElement('div');
  pista.className = 'pista';
  mando.slider = document.createElement('input');
  mando.slider.type = 'range';
  mando.slider.min = String(RANGO_MIN);
  mando.slider.max = String(RANGO_MAX);
  mando.slider.step = String(PASO);
  mando.slider.value = '0';
  mando.slider.disabled = true;
  mando.slider.style.width = PISTA_W + 'px';
  var hitoCero = document.createElement('div');
  hitoCero.className = 'hito hito-cero';
  hitoCero.style.left = (aPista(0) - 1) + 'px';
  pista.appendChild(hitoCero);
  pista.appendChild(mando.slider);
  mando.caja.appendChild(pista);
  var pie = document.createElement('div');
  pie.className = 'pista-pie';
  pie.innerHTML = '<span>' + RANGO_MIN + '</span><span class="der">+' + RANGO_MAX + '</span>';
  mando.caja.appendChild(pie);
  cajaRed.appendChild(mando.caja);

  envoltura = document.createElement('div');
  envoltura.className = 'envoltura';
  vistaRed = lienzo(DIAG_W, DIAG_H);
  envoltura.appendChild(vistaRed.el);
  cajaRed.appendChild(envoltura);
  var leyRed = document.createElement('div');
  leyRed.className = 'leyenda';
  leyRed.innerHTML =
    '<span class="it"><span class="marca" style="background:#3c64d2"></span>positivo</span>' +
    '<span class="it"><span class="marca" style="background:#d23c3c"></span>negativo</span>' +
    '<span class="it">grosor: |θ| contra el tope del deslizador</span>' +
    '<span class="it">el dibujo del nodo es su función; la salida es siempre sigmoide</span>' +
    '<span class="it">Esc suelta lo seleccionado</span>';
  cajaRed.appendChild(leyRed);
  tablero.appendChild(cajaRed);

  /* El deslizador. */
  mando.slider.addEventListener('input', function () {
    if (seleccionado === null) return;
    theta[seleccionado] = Math.round(parseFloat(mando.slider.value) / PASO) * PASO;
    registrarTocado(seleccionado);
    actualizarLectura();
    redibujar();
  });

  function posRaton(ev) {
    var r = vistaRed.el.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (DIAG_W / r.width),
             y: (ev.clientY - r.top) * (DIAG_H / r.height) };
  }
  vistaRed.el.addEventListener('mousemove', function (ev) {
    var p = posRaton(ev);
    var nj = nodoEn(p.x, p.y);
    var c = (nj === null) ? candidataEn(p.x, p.y) : null;
    if (c !== resaltado || nj !== nodoResaltado) {
      resaltado = c; nodoResaltado = nj;
      vistaRed.el.style.cursor = (c !== null || nj !== null) ? 'pointer' : 'default';
      redibujar();
    }
  });
  vistaRed.el.addEventListener('mouseleave', function () {
    if (resaltado !== null || nodoResaltado !== null) {
      resaltado = null; nodoResaltado = null;
      vistaRed.el.style.cursor = 'default';
      redibujar();
    }
  });
  /* El disco del nodo se prueba PRIMERO y gana. Un clic que no cae ni en un
     nodo ni en una candidata no hace nada: no deselecciona y no adivina. La
     salida es Esc. */
  vistaRed.el.addEventListener('click', function (ev) {
    var p = posRaton(ev);
    var nj = nodoEn(p.x, p.y);
    if (nj !== null) {
      if (menuAbierto && menuAbierto.dataset.neurona === String(nj)) { cerrarMenu(); return; }
      abrirMenu(nj);
      menuAbierto.dataset.neurona = String(nj);
      return;
    }
    var c = candidataEn(p.x, p.y);
    if (c !== null) seleccionar(c);
  });

  /* Esc tiene dos significados y en este orden: cierra el menú si está
     abierto, y si no, suelta la conexión seleccionada. */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (menuAbierto) { cerrarMenu(); return; }
    if (seleccionado !== null) deseleccionar();
  });
  /* El menú se cierra al presionar fuera de él. Se decide por dónde EMPEZÓ la
     presión y no por dónde terminó el clic: al soltar el pomo del deslizador
     fuera de la pista, el evento de clic se despacha a un ancestro común y su
     destino ya no es el deslizador. */
  document.addEventListener('pointerdown', function (ev) { origenPresion = ev.target; }, true);
  document.addEventListener('click', function () {
    if (!menuAbierto) return;
    if (origenPresion && menuAbierto.contains(origenPresion)) return;
    if (origenPresion === vistaRed.el) return;   // el lienzo ya decidió solo
    cerrarMenu();
  });

  sincronizarMando();
  redibujar();
}

function fallar(err) {
  var d = document.createElement('div');
  d.id = 'fallo';
  d.textContent = 'La página no se montó.\n\n' + (err && err.message ? err.message : String(err));
  document.body.insertBefore(d, document.getElementById('raiz'));
}

try {
  ARISTAS = verificarAncla(construirAristas());
  NODOS = verificarAnclaNodos(construirNodos());
  montar();
} catch (e) {
  fallar(e);
}

window.EXPL = {
  RANGO: { min: RANGO_MIN, max: RANGO_MAX, paso: PASO },
  theta: function () { return theta.slice(); },
  actos: function () { return ACTOS.slice(); },
  evaluar: evaluar,
  malClasificados: malClasificados,
  neuronasEnUso: neuronasEnUso,
  problemas: PROBLEMAS,
  activaciones: ACTIVACIONES,
  deseleccionar: deseleccionar,
  ponerActivacion: ponerActivacion,
  mostrarSolucion: mostrarSolucion
};
</script>
</body>
</html>
