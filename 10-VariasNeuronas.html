'use strict';
/*
Varias neuronas recurrentes — la paridad y el residuo entre tres

Es la DÉCIMA página de BasicRNA y la cuarta sobre una red recurrente. Viene
después de las tres de una sola neurona: la séptima la presenta, la octava deja
mover sus cinco parámetros a mano y la novena la entrena. Aquí la memoria deja
de ser un número y pasa a ser un vector: dos o tres neuronas de estado. Es el
mismo paso que el de la página 1 a la 2, y por la misma razón.

LO QUE ESTA PÁGINA ENSEÑA
Un problema que una neurona no puede resolver y varias sí. Dos tareas, en las
mismas tiras de la serie:
  Paridad: ¿la tira tiene un número impar de unos? Es el O exclusivo de la
  página 2 aplicado píxel tras píxel. Una neurona no puede: con un 0 el estado
  tiene que conservarse, y eso pide un lazo positivo; con un 1 tiene que
  invertirse, y eso lo pide negativo; y el lazo es uno solo. Con dos neuronas
  sí: una hace el O del bit anterior y el píxel, otra hace el Y, y el bit nuevo
  es su diferencia.
  Residuo entre tres: ¿el número de unos es múltiplo de 3? La red tiene que
  recorrer tres situaciones en ciclo, y una neurona no puede: una función
  creciente de un número no rota tres valores. Con dos tampoco aparece, y con
  tres sí.
La segunda lección la dijo Miguel al decidir la página: los parámetros crecen
aun para problemas chicos. Pasar de contar «par o impar» a contar «de tres en
tres» lleva la red de 11 parámetros a 19.

LO QUE SE MIDIÓ ANTES DE DECIDIR
Con neuronas de umbral (valen 0 o 1, con el arranque en ½, que es la tanh en
0), búsqueda exhaustiva de Claude sobre las 164 funciones posibles con dos
neuronas: la paridad sí, con 16 combinaciones; el residuo entre tres no, con
ninguna. Con una neurona, ninguna de las dos.
Con tanh, búsqueda de CC por gradiente (Adam, lote completo, tiras de 1 a 7
con el mismo peso por longitud, arranques en ±2): paridad con 2 neuronas, 26
de 500 arranques encuentran una red sin errores en las tiras de 7 y de 9;
residuo con 2 neuronas, 0 de 2500; residuo con 3 neuronas, 42 de 3500. Que no
aparezca con 2 es falta de hallazgo y no prueba, pero coincide con el umbral.

LAS SOLUCIONES
Paridad, ESCRITA. Con s = (h+1)/2, la neurona 1 se enciende con el O de (bit
anterior, píxel) y la 2 con el Y; el bit es s1 − s2. En tanh, con ganancia 4:
  W = [4, 4], U = [[2, −2], [2, −2]], b = [−2, −6], v = [3, −3], c = −3.
Medido por Claude: 0 errores en todas las tiras de 7, 9, 12 y 16 píxeles, peor
confianza 0.9413. Con ganancia 2 ya falla en tiras largas; desde 3 no.
Residuo entre tres, HALLADA Y LIMPIADA. CC la encontró por búsqueda (semilla
500059) y la redondeó a múltiplos de 0.5; la salida es escrita:
  W = [2, 4, −5.5], U = [[1.5, −2, −1], [3.5, −3, 0.5], [−0.5, 3, 2.5]],
  b = [−3, −6, 2.5], v = [0, 6, 6], c = 6.
Medido por Claude: 0 errores en todas las tiras de 7, 9, 12 y 16, peor
confianza 0.9885. En clase se explica con la máquina de umbral que esta red
realiza, deducida por Claude de sus signos y medida exacta por CC en las 131070
tiras de 1 a 16. Escrita con s = 0 o 1:
  neurona 1, «en esta vuelta ya llevo dos»:   x + s1 − 2·s2 − 2·s3 − ½ > 0
  neurona 2, «acabo de completar tres»:       x + s1 −   s2        − 1½ > 0
  neurona 3, «soy múltiplo de 3 y llegó un 0»: −x      +   s2 +   s3 − ½ > 0
  salida: «Sí» si s2 + s3 − ½ > 0.
Los signos de cada renglón son los de la red de la página. Su versión tanh
exacta pide un peso de 7 y no cabe en el tope 6 de la serie; por eso la página
carga la red hallada, que sí cabe (decisión de Miguel).
El estado «múltiplo de 3» vive en dos sitios, uno recién contado y otro en
reposo, igual que «par» en la paridad. La razón es la misma en las dos: el
píxel sólo se SUMA a lo que llega de antes, así que llegar a una situación con
un 1 y quedarse en ella con un 0 piden neuronas distintas.

EL DIBUJO DE LA RED, POR CAPAS
Con varias neuronas cada una recibe lo que TODAS dieron en el momento anterior:
n² flechas de regreso. Dibujadas como lazos y arcos, al estilo de la séptima a
la novena, se vuelven una maraña (Claude lo dibujó y lo descartó). Aquí se usa
la forma de Elman, la de los libros de los noventa: a la izquierda, junto al
píxel, una columna «de antes» con una copia de cada neurona, y de ahí las n²
líneas, rectas, a la columna de estado, como las capas de la página 2. La copia
de un momento al siguiente es gris y punteada, porque no es un parámetro, y va
de CAPA a capa: un marco rodea la columna de estado, otro la columna «de
antes», y una sola flecha los une. Con una flecha que saliera de h1 sola,
Miguel notó que parecía que sólo h1 se copiaba. Un solo sesgo por capa, como en
la 2. Al pie del dibujo, un rótulo dice que con una sola neurona la casilla «de
antes» y su línea son el lazo de la octava: la serie dibuja la misma red de dos
maneras, y lo dice en pantalla.

EL INTERRUPTOR
Debajo de la red, un interruptor elige qué se ve en un mismo lugar:
  lo que hizo en cada momento: el desenrollado de la octava, ahora con un
  renglón por neurona y n² líneas entre columnas. Las copias de un peso son un
  solo número, como allá. Las líneas del píxel salen corridas 10 px por
  neurona para que cada una se pueda señalar. Los sesgos de estado no se
  dibujan abajo, para que la malla se lea; se mueven arriba.
  el estado como un punto: con dos neuronas, dentro del cuadrado; con tres,
  dentro del cubo. La nube son las 128 tiras de entrenamiento en todos sus
  momentos, del color de lo que contestaría la red ahí; la línea negra es la
  tira cargada y el anillo verde su final. Con la solución cargada, el punto
  salta entre las esquinas de la máquina, y sólo entonces se escriben sus
  nombres. El cubo gira 27° alrededor de su eje vertical y se inclina 11°:
  Claude barrió giros de 5° a 85° e inclinaciones de 5° a 60° y ése es el par
  con más holgura entre cada vértice y cualquier línea entre otros dos (0.105
  del ancho, contra 0.046 de una perspectiva oblicua). Esta vista no tiene
  gesto: muestra la consecuencia.
Abre en el desenrollado, que es lo que el alumno conoce de la octava.

EL GESTO Y LOS BOTONES
Los de la octava: un clic en una línea, arriba o abajo, selecciona su peso, y
el deslizador lo mueve entre −6 y +6; un clic en un píxel lo enciende o lo
apaga; un clic en la galería carga una tira; ESC suelta la selección. La regla
de captura es la de la página 2, por parámetro. «Mostrar una solución»,
«Valores al azar» y «Reiniciar» aparecen al mover el segundo parámetro. Cada
tarea guarda sus propios valores: sus redes son de distinto tamaño, y cambiar
de tarea no borra lo movido en la otra.

LOS DATOS
Los de la octava: las 128 tiras de 7 píxeles para entrenar y 40 de 9 para
probar, sorteadas con splitmix32 y la misma semilla. El sorteo inicial, como en
la octava, en ±2.

LO QUE SE VERIFICA ANTES DE MONTAR
1. El ancla de la red de arriba, para 2 y 3 neuronas: cada parámetro tiene UNA
   línea, cada línea une lo que dice unir.
2. El ancla del desenrollado, para 2 y 3 neuronas y tiras de 7 y 9: cada copia
   une lo que dice unir, y cada peso tiene las copias que le tocan (del píxel,
   n·T; de regreso, n²·(T−1); a la salida, n; el sesgo de salida, 1).
3. Las dos soluciones dan cero errores en las dos particiones de su tarea, y
   en TODAS las tiras de 12 y de 16 píxeles.
4. Los controles: la paridad con su peso de regreso de h2 a h1 en cero, y el
   residuo con el sesgo de h2 en −1.5 en vez de −6, TIENEN que fallar en alguna
   longitud. Si no fallan, la verificación no distingue y la página no monta.

DÓNDE VA CADA COSA
La red dibujada una vez arriba a la izquierda y el mando a su derecha, como en
la octava; debajo el interruptor y el lugar de las dos vistas; abajo el panel
de la octava. A la derecha los contadores y la galería. Medido por Claude en
Chromium sin ventana: el contenido mide 934 px de alto con las dos tareas y las
dos vistas, y el tablero pide el mismo ancho que la octava; el ancho con una
barra de desplazamiento que ocupa espacio queda para la homogeneización de la
serie. Para caber, el lugar de las vistas mide 208 px de alto y el panel 190.
Comprobado por Claude: en la red de arriba se pueden señalar los 11 y los 19
parámetros, y en el desenrollado todos los que se dibujan (9 y 16); ningún
punto de una línea selecciona otro parámetro que el suyo. Con una línea de
regreso del desenrollado apuntando a la neurona equivocada, la página no
monta y lo dice.

Aritmética nativa de JavaScript, binary64. Un solo archivo, sin dependencias,
sin build; se abre con doble clic y dibuja con canvas 2D.

¡Feliz recorrido! :-)

Prof. Miguel Ángel Norzagaray Cosío
*/

(function () {

/* ── Las tareas y el tamaño de su red ──────────────────────────────────────
   Orden de θ para n neuronas: W (n), U (n×n, U[i][j] es de h_j de antes a
   h_i), b (n), v (n), c. Son n + n² + n + n + 1 números. */
var TAREAS = [
  { clave: 'paridad', etiqueta: 'Paridad', n: 2, pregunta: ['¿Número impar', 'de unos?'],
    correcta: function (x) { var s = 0; for (var i = 0; i < x.length; i++) s += x[i]; return s % 2; },
    solucion: [4, 4,  2, -2, 2, -2,  -2, -6,  3, -3,  -3],
    sitios: [ { s: [0, 0], rot: 'par, en reposo' }, { s: [1, 0], rot: 'impar' }, { s: [1, 1], rot: 'par, recién llegado' } ] },
  { clave: 'residuo', etiqueta: 'Residuo entre tres', n: 3, pregunta: ['¿Múltiplo de 3', 'unos?'],
    correcta: function (x) { var s = 0; for (var i = 0; i < x.length; i++) s += x[i]; return s % 3 === 0 ? 1 : 0; },
    solucion: [2, 4, -5.5,  1.5, -2, -1, 3.5, -3, 0.5, -0.5, 3, 2.5,  -3, -6, 2.5,  0, 6, 6,  6],
    sitios: [ { s: [0, 0, 1], rot: 'múltiplo, en reposo' }, { s: [1, 1, 0], rot: 'múltiplo, recién contado' },
              { s: [0, 0, 0], rot: 'llevo uno' }, { s: [1, 0, 0], rot: 'llevo dos' } ] }
];
function NP(n) { return n + n * n + n + n + 1; }
function iW(n, i) { return i; }
function iU(n, i, j) { return n + i * n + j; }
function iB(n, i) { return n + n * n + i; }
function iV(n, i) { return 2 * n + n * n + i; }
function iC(n) { return 3 * n + n * n; }
/* Qué es el parámetro k de una red de n neuronas: su papel y sus neuronas. */
function papel(n, k) {
  if (k < n) return { p: 'W', i: k };
  if (k < n + n * n) return { p: 'U', i: Math.floor((k - n) / n), j: (k - n) % n };
  if (k < 2 * n + n * n) return { p: 'B', i: k - n - n * n };
  if (k < 3 * n + n * n) return { p: 'V', i: k - 2 * n - n * n };
  return { p: 'C' };
}
function nombre(n, k) {
  var q = papel(n, k);
  if (q.p === 'W') return 'píxel → h' + (q.i + 1);
  if (q.p === 'U') return 'h' + (q.j + 1) + ' de antes → h' + (q.i + 1);
  if (q.p === 'B') return 'sesgo de h' + (q.i + 1);
  if (q.p === 'V') return 'h' + (q.i + 1) + ' → salida';
  return 'sesgo de la salida';
}

var RANGO_MIN = -6, RANGO_MAX = 6, PASO = 0.01;
var SORTEO_MIN = -2, SORTEO_MAX = 2;
var PISTA_W = 330, POMO = 18;
function Sorteador(semilla) { this.s = (semilla >>> 0) || 1; }
Sorteador.prototype.next = function () {
  this.s = (this.s + 0x9e3779b9) >>> 0;
  var z = this.s;
  z = Math.imul(z ^ (z >>> 16), 0x21f0aaad) >>> 0;
  z = Math.imul(z ^ (z >>> 15), 0x735a2d97) >>> 0;
  z = (z ^ (z >>> 15)) >>> 0;
  return z / 4294967296;
};
var SEMILLA_BASE = 20260913, nSorteo = 0;
var TOL_CAPTURA = 6, MARGEN_SEPARACION = 2.5;
var UMBRAL_RANURA = 2;

/* ── Los datos: los de la octava ───────────────────────────────────────────*/
var T_TR = 7, T_TE = 9, NTRAIN = 1 << T_TR, NTEST = 40;
var SEMILLA_DATOS = 20260929;
function aTira(m, T) { var x = []; for (var i = T - 1; i >= 0; i--) x.push((m >> i) & 1); return x; }
function generarDatos(semilla) {
  var train = [], test = [], vistos = {}, r = new Sorteador(semilla);
  for (var m = 0; m < NTRAIN; m++) train.push(aTira(m, T_TR));
  while (test.length < NTEST) {
    var k = Math.floor(r.next() * (1 << T_TE));
    if (vistos[k]) continue;
    vistos[k] = true;
    test.push(aTira(k, T_TE));
  }
  return { train: train, test: test };
}
var DATOS = generarDatos(SEMILLA_DATOS);
var TIRA_INICIAL = 90;                  // 1011010: cuatro unos — par, y no múltiplo de 3

/* ── Evaluación ────────────────────────────────────────────────────────────
   h_0 = 0; h_t = tanh(W·x_t + U·h_{t−1} + b); lo que diría la salida en t es
   σ(v·h_t + c). Devuelve los estados y la salida de cada momento. */
function sigmoide(t) { var c = Math.min(100, Math.max(-100, t)); return 1 / (1 + Math.exp(-c)); }
function leer(th, n, x) {
  var T = x.length, H = [], y = [], h = new Array(n).fill(0), i, j;
  for (var t = 0; t < T; t++) {
    var hn = [];
    for (i = 0; i < n; i++) {
      var z = th[iW(n, i)] * x[t] + th[iB(n, i)];
      for (j = 0; j < n; j++) z += th[iU(n, i, j)] * h[j];
      hn.push(Math.tanh(z));
    }
    h = hn; H.push(h);

    var rot = document.createElement('span'); rot.className = 'rotulo'; rot.textContent = 'mal clasificadas';
    rot.appendChild(document.createElement('br'));
    var de = document.createElement('span'); de.className = 'de'; de.textContent = detalle; rot.appendChild(de);
    caja.appendChild(cifra); caja.appendChild(rot); cifras.appendChild(caja); return cifra;
  }
  nodos.cTrain = par('de ' + NTRAIN + ' entren.'); nodos.cTest = par('de ' + NTEST + ' prueba');
  cajaGal.appendChild(cifras);
  vistaGal = lienzo(GAL_W, GAL_H); cajaGal.appendChild(vistaGal.el);
  var legG = document.createElement('div'); legG.className = 'leyenda';
  legG.innerHTML =
    '<span class="it"><span class="llave" style="background:#e8825a"></span>Sí</span>' +
    '<span class="it"><span class="llave" style="background:#4b8bbe"></span>No</span>' +
    '<span class="it">marco: la respuesta correcta</span>' +
    '<span class="it"><span class="llave" style="background:#e8825a;box-shadow:0 0 0 2px #4b8bbe"></span>anillo: mal clasificada, del color que contestó</span>' +
    '<span class="it">un clic en una tira la carga</span>';
  cajaGal.appendChild(legG);
  tablero.appendChild(cajaGal);
  raiz.appendChild(tablero);

  mando.caja = cajaMando; mando.rot = document.getElementById('mando-rot'); mando.copias = document.getElementById('mando-copias');
  mando.val = document.getElementById('mando-val'); mando.slider = document.getElementById('mando-slider');
  document.getElementById('mando-cero').style.left = (aPista(0) - 1) + 'px';
  mando.slider.addEventListener('input', function () {
    if (seleccionado === null) return;
    theta()[seleccionado] = parseFloat(mando.slider.value);
    registrarTocado(seleccionado); redibujar();
  });

  function posRaton(v, ev) { var r = v.el.getBoundingClientRect(); return { x: (ev.clientX - r.left) * (v.w / r.width), y: (ev.clientY - r.top) * (v.h / r.height) }; }
  vistaRed.el.addEventListener('mousemove', function (ev) {
    var q = posRaton(vistaRed, ev), c = candidataEnRed(q.x, q.y);
    vistaRed.el.style.cursor = c !== null ? 'pointer' : 'default';
    if (c !== resaltado) { resaltado = c; redibujar(); }
  });
  vistaRed.el.addEventListener('mouseleave', function () { vistaRed.el.style.cursor = 'default'; if (resaltado !== null) { resaltado = null; redibujar(); } });
  vistaRed.el.addEventListener('click', function (ev) {
    var q = posRaton(vistaRed, ev), c = candidataEnRed(q.x, q.y);
    if (c === null) return; resaltado = c; seleccionar(c);
  });
  /* En el lugar de las vistas sólo hay gesto con el desenrollado: el estado
     como un punto es consecuencia y no se toca. */
  vistaLugar.el.addEventListener('mousemove', function (ev) {
    if (vista !== 'desenrollado') { vistaLugar.el.style.cursor = 'default'; return; }
    var q = posRaton(vistaLugar, ev), px = pixelEn(q.x, q.y), c = (px === null) ? candidataEnDes(q.x, q.y) : null;
    vistaLugar.el.style.cursor = (px !== null || c !== null) ? 'pointer' : 'default';
    if (c !== resaltado) { resaltado = c; redibujar(); }
  });
  vistaLugar.el.addEventListener('mouseleave', function () { vistaLugar.el.style.cursor = 'default'; if (resaltado !== null) { resaltado = null; redibujar(); } });
  vistaLugar.el.addEventListener('click', function (ev) {
    if (vista !== 'desenrollado') return;
    var q = posRaton(vistaLugar, ev), px = pixelEn(q.x, q.y);
    if (px !== null) { alternar(px); return; }
    var c = candidataEnDes(q.x, q.y); if (c === null) return;
    resaltado = c; seleccionar(c);
  });
  vistaGal.el.addEventListener('mousemove', function (ev) { var q = posRaton(vistaGal, ev); vistaGal.el.style.cursor = miniaturaEn(q.x, q.y) !== null ? 'pointer' : 'default'; });
  vistaGal.el.addEventListener('click', function (ev) { var q = posRaton(vistaGal, ev), m = miniaturaEn(q.x, q.y); if (m !== null) cargar(m.c, m.i); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && seleccionado !== null) deseleccionar(); });
  sincronizarMando(); redibujar();
}

function fallar(err) {
  var caja = document.createElement('div'); caja.id = 'fallo';
  caja.textContent = 'La página no arrancó y no se dibujó ningún lienzo.\n\n' + err.message;
  document.getElementById('raiz').appendChild(caja);
}

try {
  [2, 3].forEach(function (N) {
    REDES[N] = verificarRed(N, construirRed(N));
    [T_TR, T_TE].forEach(function (T) { ANCLAS[N + ':' + T] = verificarAncla(construirAncla(N, T), N, T); });
  });
  VERIF = verificarSoluciones();
  montar();
} catch (err) {
  fallar(err);
  throw err;
}

window.EXPL = {
  DATOS: DATOS, TAREAS: TAREAS, REDES: REDES, ANCLAS: ANCLAS, VERIF: VERIF, THETA_INICIAL: THETA_INICIAL,
  NP: NP, papel: papel, nombre: nombre, leer: leer, erroresDe: errores, tirasDe: tirasDe,
  candidataEnRed: candidataEnRed, candidataEnDes: candidataEnDes, pixelEn: pixelEn, miniaturaEn: miniaturaEn,
  theta: function () { return theta().slice(); }, fijarTheta: function (v) { THETAS[iTarea] = v.slice(); sincronizarMando(); redibujar(); },
  tarea: function () { return iTarea; }, fijarTarea: fijarTarea, vista: function () { return vista; }, fijarVista: fijarVista,
  seleccionado: function () { return seleccionado; }, seleccionar: seleccionar, deseleccionar: deseleccionar,
  cargar: cargar, alternar: alternar, tira: function () { return tira.slice(); },
  mostrarSolucion: mostrarSolucion, aleatorizarTodo: aleatorizarTodo, restaurarTodo: restaurarTodo,
  errores: function () { return { train: errores(theta(), iTarea, DATOS.train), test: errores(theta(), iTarea, DATOS.test) }; },
  lienzoRed: function () { return vistaRed; }, lienzoLugar: function () { return vistaLugar; }
};

})();
</script>
