<script>
'use strict';
/*
El lazo como matriz — la señal de gradiente con dos neuronas

Es la UNDÉCIMA página de BasicRNA y va después de la de varias neuronas (la
décima). Su teoría —el paso de un número a una matriz, ρ y σ₁, la desigualdad
fundamental y las cinco matrices— está en Explica.md; lo que aquí se decidió al
construir está en la última sección.

POR QUÉ EXISTE
En la novena la red tenía una sola neurona, y la señal de error regresaba
multiplicándose en cada paso por un número, u·tanh′. Con dos neuronas ese número
se vuelve una matriz de 2×2, F_t = D_t·Uᵀ, y aparecen tres cosas que con un
número no existen: la dirección (la señal es una flecha en el plano), dos
medidas distintas del tamaño de la matriz (el radio espectral ρ, que dice qué
pasa a la larga, y el mayor valor singular σ₁, que dice lo más que estira un
paso), y un factor que cambia en cada momento, porque D_t depende del estado.
La página enseña que la red avanza con U y la señal regresa con Uᵀ, que
σ₁ < 1 garantiza que la señal se apaga y σ₁ > 1 sólo lo permite, y que la
saturación de tanh encoge la señal.

LA RED
Dos neuronas de memoria, una entrada de un bit por momento, T = 40 momentos:
  z_t = W·x_t + U·h_(t−1) + b,    h_t = φ(z_t),    h_0 = (0, 0).
u_ij es el peso de la línea que va DE la neurona j A la neurona i; con esa
convención se dibuja cada línea y se escribe cada matriz. La señal es
δ_t = ∂L/∂z_t y regresa así:
  δ_t = D_t · Uᵀ · δ_(t+1),   D_t = diag(φ′(z_t,1), φ′(z_t,2)).
Con tanh, φ′(z) = 1 − h²; en lineal, φ(z) = z y D_t es la identidad.
La página no entrena: v, c e y no intervienen. δ_T lo pone la matriz elegida
(siempre de largo 1) y el alumno puede girarlo arrastrándolo en el plano.
Con T = 40 momentos hay 39 pasos hacia atrás: k va de 0 a 39.
W y b se escalan juntos con el deslizador «empuje» a:
  W = a·(1, 0.5),    b = a·(0.3, −0.2).
Con a = 0 nada empuja a las neuronas, la memoria se queda en cero y tanh da lo
mismo que lineal. Las dos neuronas reciben entrada y sesgo distintos a
propósito: los dos renglones de la matriz 5 son iguales, así que
z_t,1 − z_t,2 = (w1 − w2)·x_t + (b1 − b2) no depende de la memoria, y si fuera
cero las dos pendientes serían iguales y la matriz seguiría siendo nilpotente
aun con tanh. Con a > 0 esa diferencia vale 0.5·a o a, nunca cero.
La entrada son 40 bits sorteados una vez con splitmix32 y la semilla 20261007.

LAS CINCO MATRICES
  1 diagonal     [0.9 0; 0 0.5]          ρ 0.9   σ₁ 0.9     normal
  2 simétrica    [0.8 0.4; 0.4 0.8]      ρ 1.2   σ₁ 1.2     normal
  3 giro         0.9·(giro de 30°)       ρ 0.9   σ₁ 0.9     normal
  4 joroba       [0.9 1; 0 0.9]          ρ 0.9   σ₁ 1.530   no normal
  5 nilpotente   [2 −2; 2 −2]            ρ 0     σ₁ 4       no normal
La 4 tiene el mismo ρ que la 1 y la 3. En lineal, desde δ_T = (1, 0), la señal
sube hasta 3.893 en el paso 9 y no baja de 1 sino hasta el paso 35; la de giro,
en el paso 9, vale 0.387. Medido por Claude con un arnés en Node, binary64,
y verificado por la página al montar (sección siguiente).
Lo que pasa en tanh con el empuje inicial a = 0.2, medido por Claude con el
mismo arnés: la simétrica, que en lineal crece hasta 866 en el paso 39, cae a
0.34 en el primer paso y a 7·10⁻⁷ en el 20, porque el eigenvalor 1.2 lleva la
memoria a la saturación; la joroba sube sólo hasta 1.26 (contra 3.89); la
nilpotente pasa de 3.53 a 0.91 en el segundo paso, en vez de a cero. Con a = 1
las cinco quedan por debajo de 10⁻² hacia el paso 20 y se borra lo que la
página quiere mostrar (la joroba, por ejemplo, ya no pasa de 1); por eso el
empuje empieza en 0.2.

LO QUE SE VERIFICA ANTES DE MONTAR
Si algo falla no se crea ningún lienzo y la página lo dice.
1. El ancla del dibujo: cuatro líneas de regreso, una por cada par (i, j); cada
   una sale de la copia j y llega a la neurona i; su grosor y su color salen
   de U[i][j]; y en la ecuación de regreso el número del renglón j, columna i,
   es ese mismo U[i][j].
2. El gradiente: para las cinco matrices, en lineal y en tanh, con a = 0.2 y
   a = 1, en ocho momentos, la señal que calcula la página contra diferencias
   centradas de la pérdida L = g·h_8 (g sorteado). Peor error relativo medido
   por Claude: 4.2·10⁻¹⁰; tolerancia 10⁻⁶.
3. El control: la misma cuenta con U en lugar de Uᵀ TIENE que fallar en las
   tres matrices que no son simétricas (medido: 0.55, 2.08 y 2.30). Si no
   falla, la verificación no distingue y la página no monta.
4. Las cifras que la página afirma: ρ, σ₁ y σ₂ de cada matriz; cuáles son
   normales; UᵀUᵀ = 0 exactamente en la 5; Uᵀ·(1, 0) = (0.779, −0.450) en la
   3, que es girar en el sentido de las manecillas; y en la 4, en lineal,
   3.893 en el paso 9 y la primera vez bajo 1 en el paso 35.
Claude probó las dos mitades del criterio en Chromium sin ventana: una copia
con la línea u₁₂ saliendo de la copia equivocada y otra que regresa la señal
con U en vez de Uᵀ no montan, no crean ningún lienzo y dicen por qué.
Los eigenvalores se sacan de la fórmula de 2×2. En la 4 y la 5 el
discriminante es cero en exacto, pero en binary64 puede salir ±10⁻¹⁶; se toma
como cero si su tamaño no pasa de 10⁻¹² veces la traza al cuadrado, porque si
saliera negativo la página diría que la 4 tiene eigenvalores complejos.

EL GESTO Y LOS BOTONES
Arriba, la matriz, la activación y el empuje; abajo, «Un paso atrás» (animado),
«Hasta el final», «Reiniciar» y «δ_T de la matriz». En k = 0 la flecha de δ_T
se arrastra en el plano (o se gira con las flechas del teclado, de 5° en 5°);
siempre mide 1. Cambiar la activación o el empuje recalcula todo y conserva k,
para comparar lineal y tanh en el mismo paso; cambiar de matriz vuelve a k = 0
con el δ_T de esa matriz. Si la señal se vuelve exactamente cero (la 5 en
lineal, desde el paso 2) ya no hay paso atrás que dar.

QUÉ SE ILUMINA Y CON QUÉ COLOR
El presupuesto de la serie: azul y rojo son el signo del peso; verde, el paso
en turno (en la tira de la entrada); verde azulado, la señal δ, como anillo en
la neurona y como flecha en el plano; gris, todo lo demás. El grosor de una
línea es |peso| contra el tope 6, con raíz, como en las demás páginas. El
anillo de δ va en escala logarítmica de 10⁻⁹ a 10, como en la novena.

LOS TRES NIVELES
Hacia adelante (arriba a la izquierda): la red dibujada a la manera de Elman,
como en la décima: a la izquierda la copia de la memoria del momento t, a la
derecha las neuronas del momento t+1, y entre ellas las cuatro líneas u_ij.
Hacia atrás (abajo a la izquierda): la MISMA figura, con las mismas líneas,
recorrida al revés. Los dos niveles muestran siempre el mismo par de momentos:
en k = 0, el que se va a recorrer primero (39 → 40).
El plano (arriba a la derecha): un paso a la vez. La flecha de entrada se
dibuja con largo 1 sobre el círculo de radio 1 y su largo verdadero se escribe
abajo; la elipse es la imagen de ese círculo bajo Uᵀ (semiejes σ₁ y σ₂) y, en
tanh, la de D_t·Uᵀ. Las líneas punteadas son las direcciones que Uᵀ no gira.
La curva (abajo a la derecha) lleva la cuenta acumulada: el largo de la señal,
el techo σ₁ᵏ y, sólo en lineal, ρᵏ.
En tanh, junto a la red, el cuadrado de la décima con la memoria h_t como
punto: cerca del borde, 1 − h² es chico.

DÓNDE VA CADA COSA
Arriba la barra, en dos renglones. Debajo, dos columnas de 610 y 506 px: a la
izquierda, hacia adelante y hacia atrás; a la derecha, el plano y la curva.
Medido por Claude en Chromium sin ventana a 1196 × 940: el contenido más alto,
entre las cinco matrices, los dos modos y k en 0, 1 y el final, mide 924 px;
el ancho, 1130 más los márgenes, deja lugar a una barra de desplazamiento de
15 px.

DECIDIDO AL CONSTRUIR
- El empuje va de 0 a 2 y empieza en 0.2, no de 0 a 3 empezando en 1 (la
  razón está en «Las cinco matrices»).
- k llega a 39, no a 40: con T = 40 momentos hay 39 pasos hacia atrás.
- No se dibujan la neurona de salida ni los sesgos: v y c no intervienen, y b
  está en la ecuación.

Aritmética nativa de JavaScript, binary64. Un solo archivo, sin dependencias,
sin build; se abre con doble clic y dibuja con canvas 2D.
*/

/* ── Constantes ─────────────────────────────────────────────────────────── */
var T = 40;
var SEMILLA = 20261007;
var TOPE = 6;
var EMPUJE_MIN = 0, EMPUJE_MAX = 2, EMPUJE_PASO = 0.05, EMPUJE_INICIAL = 0.2;
var C_DELTA = '23,150,140', VERDE = '34,160,80';
var POSITIVO = '60,100,210', NEGATIVO = '210,60,60';
var DUR_PASO = 950;   // ms de la animación de un paso atrás

function Sorteador(semilla) { this.s = (semilla >>> 0) || 1; }
Sorteador.prototype.next = function () {
  this.s = (this.s + 0x9e3779b9) >>> 0;
  var z = this.s;
  z = Math.imul(z ^ (z >>> 16), 0x21f0aaad) >>> 0;
  z = Math.imul(z ^ (z >>> 15), 0x735a2d97) >>> 0;
  z = (z ^ (z >>> 15)) >>> 0;
  return z / 4294967296;
};

var R2 = Math.SQRT1_2, C30 = Math.cos(Math.PI / 6), S30 = Math.sin(Math.PI / 6);

/* Las cinco matrices. rho, s1, s2 y normal son lo que la página AFIRMA; se
   comparan con lo que calcula antes de montar. */
var MATRICES = [
  { nombre: 'diagonal', U: [[0.9, 0], [0, 0.5]], dT: [R2, R2], simetrica: true,
    rho: 0.9, s1: 0.9, s2: 0.5, normal: true,
    pista: 'Las neuronas no se mezclan: cada componente se encoge por su propio número. La flecha no gira, pero termina sobre el eje de la neurona 1.' },
  { nombre: 'simétrica', U: [[0.8, 0.4], [0.4, 0.8]], dT: [1, 0], simetrica: true,
    rho: 1.2, s1: 1.2, s2: 0.4, normal: true,
    pista: 'En lineal la flecha se alinea con (1, 1) y crece. Pasa a tanh: el eigenvalor 1.2 satura la memoria y la señal se apaga.' },
  { nombre: 'giro', U: [[0.9 * C30, -0.9 * S30], [0.9 * S30, 0.9 * C30]], dT: [1, 0], simetrica: false,
    rho: 0.9, s1: 0.9, s2: 0.9, normal: true,
    pista: 'U gira 30° contra las manecillas; Uᵀ, con las manecillas: la memoria y la señal giran al revés. Una vuelta cada 12 pasos.' },
  { nombre: 'joroba', U: [[0.9, 1], [0, 0.9]], dT: [1, 0], simetrica: false,
    rho: 0.9, s1: 1.530, s2: 0.530, normal: false,
    pista: 'El mismo ρ = 0.9 que la 1 y la 3, y aun así la señal crece hasta el paso 9. Prueba δ₄₀ en (0, 1): ahí no hay joroba.' },
  { nombre: 'nilpotente', U: [[2, -2], [2, -2]], dT: [R2, R2], simetrica: false,
    rho: 0, s1: 4, s2: 0, normal: false,
    pista: 'Uᵀ manda todo a la línea de (1, −1), y esa misma línea la manda a cero. En tanh, D se mete entre los dos pasos y ya no se anula.' }
];

/* La entrada: 40 bits, sorteados una vez. X[0] no se usa. */
var X = [0];
(function () { var r = new Sorteador(SEMILLA); for (var t = 1; t <= T; t++) X.push(r.next() < 0.5 ? 0 : 1); })();

/* ── Álgebra de 2×2 ─────────────────────────────────────────────────────── */
function transpuesta(A) { return [[A[0][0], A[1][0]], [A[0][1], A[1][1]]]; }
function porVector(A, v) { return [A[0][0] * v[0] + A[0][1] * v[1], A[1][0] * v[0] + A[1][1] * v[1]]; }
function porMatriz(A, B) {
  return [[A[0][0] * B[0][0] + A[0][1] * B[1][0], A[0][0] * B[0][1] + A[0][1] * B[1][1]],
          [A[1][0] * B[0][0] + A[1][1] * B[1][0], A[1][0] * B[0][1] + A[1][1] * B[1][1]]];
}
function largo(v) { return Math.sqrt(v[0] * v[0] + v[1] * v[1]); }

/* Eigenvalores por la fórmula de 2×2, con el discriminante casi cero tomado
   como cero (la razón está en la cabecera). */
function espectro(A) {
  var tr = A[0][0] + A[1][1], det = A[0][0] * A[1][1] - A[0][1] * A[1][0];
  var disc = tr * tr - 4 * det;
  if (Math.abs(disc) <= 1e-12 * Math.max(1, tr * tr)) return { tipo: 'doble', l: [tr / 2], rho: Math.abs(tr / 2) };
  if (disc > 0) {
    var r = Math.sqrt(disc), l1 = (tr + r) / 2, l2 = (tr - r) / 2;
    return { tipo: 'reales', l: [l1, l2], rho: Math.max(Math.abs(l1), Math.abs(l2)) };
  }
  var mod = Math.sqrt(det), ang = Math.atan2(Math.sqrt(-disc) / 2, tr / 2) * 180 / Math.PI;
  return { tipo: 'complejos', mod: mod, ang: ang, rho: mod };
}
/* σ₁ y σ₂ de una 2×2: σ₁² + σ₂² es la suma de los cuadrados y σ₁·σ₂ = |det|. */
function singulares(A) {
  var S = A[0][0] * A[0][0] + A[0][1] * A[0][1] + A[1][0] * A[1][0] + A[1][1] * A[1][1];
  var det = A[0][0] * A[1][1] - A[0][1] * A[1][0];
  var r = Math.sqrt(Math.max(0, S * S - 4 * det * det));
  return [Math.sqrt((S + r) / 2), Math.sqrt(Math.max(0, (S - r) / 2))];
}
/* Las direcciones que A no gira (eigenvectores reales), de largo 1. */
function direccionesFijas(A) {
  var e = espectro(A);
  if (e.tipo === 'complejos') return [];
  return e.l.map(function (l) {

/* El cuadrado de la décima: la memoria como punto, sólo en tanh. */

/* ── Nivel 3: el plano ─────────────────────────────────────────────────── */
function geometriaPlano(v) {
  var esc = Math.max(1, est.rec.sv[0]);
  return { cx: v.w / 2, cy: v.h / 2 + 4, R: (Math.min(v.w, v.h) / 2 - 22) / esc };
}
function dibujarPlano(v, p) {
  var ctx = v.ctx, rec = est.rec, G = geometriaPlano(v), cx = G.cx, cy = G.cy, R = G.R, Ut = rec.re.Ut, t = momentoT();
  limpiar(v);
  var P = function (q) { return { x: cx + q[0] * R, y: cy - q[1] * R }; };
  // ejes
  ctx.strokeStyle = '#e3e7eb'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(8, cy); ctx.lineTo(v.w - 8, cy); ctx.moveTo(cx, 8); ctx.lineTo(cx, v.h - 8); ctx.stroke();
  ctx.fillStyle = '#8a949c'; ctx.font = '11.5px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  ctx.textAlign = 'right'; ctx.fillText('neurona 1', v.w - 8, cy - 9);
  ctx.textAlign = 'left'; ctx.fillText('neurona 2', cx + 6, 12);
  // direcciones que Uᵀ no gira
  ctx.save(); ctx.setLineDash([2, 4]); ctx.strokeStyle = '#9aa4ac'; ctx.lineWidth = 1.2;
  rec.fijas.forEach(function (d) {
    var L = 2 * Math.max(v.w, v.h);
    ctx.beginPath(); ctx.moveTo(cx - d[0] * L, cy + d[1] * L); ctx.lineTo(cx + d[0] * L, cy - d[1] * L); ctx.stroke();
  });
  ctx.restore();
  // círculo de radio 1
  ctx.strokeStyle = '#aab3bb'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  // elipses: imagen del círculo bajo Uᵀ y, en tanh, bajo D_t·Uᵀ
  var elipse = function (A, guion, color, ancho) {
    ctx.save(); if (guion) ctx.setLineDash(guion); ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.beginPath();
    for (var n = 0; n <= 120; n++) { var th = n / 120 * 2 * Math.PI, q = P(porVector(A, [Math.cos(th), Math.sin(th)])); if (n) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y); }
    ctx.stroke(); ctx.restore();
  };
  elipse(Ut, null, '#5c666f', 1.6);
  var Dt = rec.av.D[t];
  if (est.tanh) elipse([[Dt[0] * Ut[0][0], Dt[0] * Ut[0][1]], [Dt[1] * Ut[1][0], Dt[1] * Ut[1][1]]], [5, 4], '#23282e', 1.3);

  // rastro: las direcciones por las que ya pasó la señal
  for (var kk = 0; kk <= est.k; kk++) {
    var d = rec.re.DEL[T - kk], n = largo(d); if (!n) continue;
    var q = P([d[0] / n, d[1] / n]), alfa = 0.15 + 0.45 * (kk + 1) / (est.k + 1);
    ctx.fillStyle = 'rgba(' + C_DELTA + ',' + alfa.toFixed(2) + ')'; ctx.beginPath(); ctx.arc(q.x, q.y, 2.6, 0, Math.PI * 2); ctx.fill();
  }

  var dibFlecha = function (q, estilo, ancho, alfa) {
    var A = P([0, 0]), B = P(q), len = Math.hypot(B.x - A.x, B.y - A.y);
    ctx.save(); if (estilo) ctx.setLineDash(estilo);
    if (len < 1.5) { ctx.restore(); return; }
    var color = 'rgba(' + C_DELTA + ',' + alfa + ')', ang = Math.atan2(B.y - A.y, B.x - A.x), tam = Math.min(11, len * 0.5);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = ancho;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x - Math.cos(ang) * tam * 0.7, B.y - Math.sin(ang) * tam * 0.7); ctx.stroke();
    ctx.setLineDash([]); punta(ctx, B.x, B.y, ang, tam); ctx.restore();
  };
  var rotulo = function (q, partes, col) {
    var B = P(q), n = Math.hypot(q[0], q[1]) || 1, ux = q[0] / n, uy = -q[1] / n;
    ctx.fillStyle = col || 'rgb(16,118,110)';
    textoRico(ctx, partes, B.x + ux * 16, B.y + uy * 14, 12.5, ux > 0.3 ? 'left' : (ux < -0.3 ? 'right' : 'center'));
  };

  if (est.k === 0) {
    var d0 = rec.re.DEL[T], g0 = porVector(Ut, d0);
    dibFlecha(g0, [5, 4], 1.6, 0.55);
    rotulo(g0, [['U'], ['T', 'sup'], ['δ' + sub(T) + ' (el primer paso)']], '#5c666f');
    dibFlecha(d0, null, 3, 0.95);
    var Q = P(d0); ctx.fillStyle = '#ffffff'; ctx.strokeStyle = 'rgb(' + C_DELTA + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(Q.x, Q.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    rotulo(d0, [['δ' + sub(T)]]);
  } else {
    var dIn = rec.re.DEL[t + 1], nIn = largo(dIn), ent = [dIn[0] / nIn, dIn[1] / nIn];
    var med = [rec.re.G[t][0] / nIn, rec.re.G[t][1] / nIn], sal = [rec.re.DEL[t][0] / nIn, rec.re.DEL[t][1] / nIn];
    var p1 = Math.min(1, p / 0.55), p2 = Math.max(0, Math.min(1, (p - 0.55) / 0.45));
    var mezcla = function (a, b, u) { return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; };
    dibFlecha(ent, null, 2, 0.35);
    if (p1 < 1) dibFlecha(mezcla(ent, med, p1), null, 3, 0.95);
    else {
      if (est.tanh) { dibFlecha(med, [5, 4], 1.8, 0.7); }
      dibFlecha(est.tanh ? mezcla(med, sal, p2) : sal, null, 3, 0.95);
      if (p >= 1) {
        if (est.tanh && largo([med[0] - sal[0], med[1] - sal[1]]) * R > 14) rotulo(med, [['U'], ['T', 'sup'], ['δ' + sub(t + 1)]], 'rgba(16,118,110,0.75)');
        if (largo(sal) * R < 2) {
          ctx.fillStyle = 'rgb(16,118,110)'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
          ctx.font = '12.5px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('δ' + sub(t) + ' = 0', cx + 8, cy + 12);
        } else rotulo(sal, [['δ' + sub(t)]]);
      }
    }
  }
}

/* ── La curva ──────────────────────────────────────────────────────────── */
function rangoCurva() {
  var L = est.rec.largos, mn = Infinity, mx = 1;
  L.forEach(function (x) { if (x > 0) { mn = Math.min(mn, x); mx = Math.max(mx, x); } });
  var lo = Math.max(-16, Math.floor(Math.log10(mn))), hi = Math.ceil(Math.log10(mx * 1.0001));
  if (hi <= lo + 1) { lo -= 1; hi += 1; }
  if (hi < 1) hi = 1;
  return { lo: lo, hi: hi };
}
function dibujarCurva(v, p) {
  var ctx = v.ctx, rec = est.rec, rg = rangoCurva(), IZ = 46, DE = 12, AR = 8, AB = 20;
  var W = v.w - IZ - DE, H = v.h - AR - AB;
  limpiar(v);
  var X_ = function (k) { return IZ + k / (T - 1) * W; };
  var Y_ = function (val) { return AR + (rg.hi - Math.log10(val)) / (rg.hi - rg.lo) * H; };
  // rejilla de décadas
  var dec = rg.hi - rg.lo, cada = dec > 12 ? 4 : (dec > 7 ? 2 : 1);
  ctx.font = '11px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  for (var e = rg.lo; e <= rg.hi; e++) {
    var y = Y_(Math.pow(10, e));
    ctx.strokeStyle = e === 0 ? '#c9d0d6' : '#eef1f4'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(IZ, y); ctx.lineTo(IZ + W, y); ctx.stroke();
    if ((e - rg.lo) % cada === 0 || e === 0) { ctx.fillStyle = '#6d777f'; ctx.textAlign = 'right'; ctx.fillText(e === 0 ? '1' : '10' + sup(e), IZ - 6, y); }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#6d777f';
  for (var k = 0; k < T; k += 5) ctx.fillText(String(k), X_(k), AR + H + 4);
  ctx.fillText('39', X_(39), AR + H + 4);
  ctx.save(); ctx.beginPath(); ctx.rect(IZ, AR - 1, W, H + 2); ctx.clip();
  var curvaRef = function (f, guion) {
    ctx.save(); ctx.setLineDash(guion); ctx.strokeStyle = '#5c666f'; ctx.lineWidth = 1.4; ctx.beginPath();
    var dentro = false;
    for (var kk = 0; kk < T; kk++) {
      var val = f(kk); if (!(val > 0)) { dentro = false; continue; }
      var yy = Y_(val); if (yy < AR - 40) yy = AR - 40;
      if (dentro) ctx.lineTo(X_(kk), yy); else { ctx.moveTo(X_(kk), yy); dentro = true; }
    }
    ctx.stroke(); ctx.restore();
  };
  var s1 = rec.sv[0], rho = rec.esp.rho;
  curvaRef(function (kk) { return Math.pow(s1, kk); }, [6, 4]);
  if (!est.tanh && rho > 0 && Math.abs(rho - s1) > 1e-9) curvaRef(function (kk) { return Math.pow(rho, kk); }, [1.5, 3.5]);
  // la señal, hasta el paso en turno
  var hasta = est.k - (est.anim && p < 1 ? 1 : 0);
  ctx.strokeStyle = 'rgb(' + C_DELTA + ')'; ctx.lineWidth = 2.2; ctx.beginPath();
  var ab = false;
  for (k = 0; k <= hasta; k++) {
    var l = rec.largos[k];
    if (l > 0) { var yl = Y_(l); if (ab) ctx.lineTo(X_(k), yl); else { ctx.moveTo(X_(k), yl); ab = true; } } else ab = false;
  }
  ctx.stroke();
  for (k = 0; k <= hasta; k++) {
    if (rec.largos[k] > 0) { ctx.fillStyle = 'rgb(' + C_DELTA + ')'; ctx.beginPath(); ctx.arc(X_(k), Y_(rec.largos[k]), 2.6, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
  // ceros exactos, al pie
  for (k = 0; k <= hasta; k++) if (rec.largos[k] === 0) {
    ctx.fillStyle = 'rgb(16,118,110)'; ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('0', X_(k), AR + H - 1);
  }
  // el paso en turno
  ctx.strokeStyle = 'rgba(' + VERDE + ',0.8)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(X_(est.k), AR); ctx.lineTo(X_(est.k), AR + H); ctx.stroke();
  ctx.strokeStyle = '#c9d0d6'; ctx.lineWidth = 1; ctx.strokeRect(IZ + 0.5, AR + 0.5, W - 1, H - 1);
}

}
function todo() { actualizarTextos(); redibujar(); }

var REDUCIR = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animar() {
  if (!est.anim) return;
  redibujar();
  if (progreso() < 1) requestAnimationFrame(animar);
  else { est.anim = null; redibujar(); }
}
function pasoAtras() {
  if (est.k >= kTope()) return;
  est.k += 1;
  est.anim = REDUCIR ? null : { t0: performance.now() };
  actualizarTextos();
  if (est.anim) requestAnimationFrame(animar); else redibujar();
}
function hastaFinal() { est.anim = null; est.k = kTope(); todo(); }
function reiniciar() { est.anim = null; est.k = 0; todo(); }

/* ── Montaje ───────────────────────────────────────────────────────────── */
function montar() {
  var raiz = document.getElementById('raiz');
  var barra = document.createElement('div'); barra.className = 'barra';
  var html = '<span class="titulo">Matriz</span>';
  MATRICES.forEach(function (m, i) {
    html += '<label' + (i === est.im ? ' class="puesto"' : '') + '><input type="radio" name="matriz" value="' + i + '"' +
            (i === est.im ? ' checked' : '') + '>' + (i + 1) + ' ' + m.nombre + '</label>';
  });
  html += '<span class="divisor"></span><span class="titulo">Activación</span>' +
    '<label class="puesto"><input type="radio" name="act" value="lineal" checked>lineal</label>' +
    '<label><input type="radio" name="act" value="tanh">tanh</label>' +
    '<span class="salto"></span>' +
    '<span class="empuje" id="empuje"><span>empuje a</span><input type="range" id="a" min="' + EMPUJE_MIN + '" max="' + EMPUJE_MAX +
    '" step="' + EMPUJE_PASO + '" value="' + EMPUJE_INICIAL + '" aria-label="empuje a"><span class="val" id="a-val">' + EMPUJE_INICIAL.toFixed(2) + '</span></span>' +
    '<span class="divisor"></span>' +
    '<button type="button" id="b-paso" class="principal">Un paso atrás</button>' +
    '<button type="button" id="b-final">Hasta el final</button>' +
    '<button type="button" id="b-reiniciar">Reiniciar</button>' +
    '<span class="divisor"></span>' +
    '<button type="button" id="b-delta">δ<sub>' + T + '</sub> de la matriz</button>' +
    '<span class="consigna" id="narra"></span>';
  barra.innerHTML = html;
  raiz.appendChild(barra);

  var tablero = document.createElement('div'); tablero.className = 'tablero';
  tablero.innerHTML =
    '<div class="columna">' +
      '<div class="caja" id="caja-ida"><div class="tit" id="tit-ida"></div><div id="sitio-tira"></div>' +
        '<div class="fila" style="margin-top:4px"><div id="sitio-ida"></div><div id="sitio-cuadrado"></div>' +
        '<div class="nota-lineal" id="nota-lineal">En lineal la memoria no tiene límite (con la matriz 2 pasa de 1000) y la pendiente vale 1 en todas partes: D es la identidad. Pasa a tanh para ver la memoria dentro del cuadrado.</div></div>' +
        '<div class="ec" id="ec-ida1"></div><div class="ec" id="ec-ida2"></div></div>' +
      '<div class="caja" id="caja-vuelta"><div class="tit" id="tit-vuelta"></div>' +
        '<div class="fila"><div id="sitio-vuelta"></div><div id="cifras"></div></div>' +
        '<div class="ec" id="ec-vuelta1"></div><div class="ec" id="ec-vuelta2"></div>' +
        '<div class="leyenda">' +
          '<span class="it"><span class="marca" style="background:rgb(60,100,210)"></span><span class="marca" style="background:rgb(210,60,60)"></span>signo del peso; grosor contra el tope 6</span>' +
          '<span class="it"><span class="marca" style="background:rgb(23,150,140);height:5px"></span>anillo: |δ| en escala log, de 10⁻⁹ a 10</span>' +
        '</div></div>' +
    '</div>' +
    '<div class="columna">' +
      '<div class="caja"><div class="tit">El paso en el plano</div><table class="ficha" id="ficha"></table>' +
        '<div class="pista" id="pista"></div><div id="sitio-plano"></div><div class="pie" id="pie-plano"></div>' +
        '<div class="leyenda">' +
          '<span class="it"><span class="marca" style="background:#aab3bb"></span>círculo de radio 1</span>' +
          '<span class="it"><span class="marca" style="background:#5c666f"></span>imagen bajo U<sup>T</sup></span>' +
          '<span class="it" id="it-elipse-d"><span class="marca guion" style="border-color:#23282e"></span>bajo D·U<sup>T</sup></span>' +
          '<span class="it"><span class="marca punto" style="border-color:#9aa4ac"></span>sin giro bajo U<sup>T</sup></span>' +
        '</div></div>' +
      '<div class="caja"><div class="tit">El largo de la señal contra los pasos hacia atrás, k</div><div id="sitio-curva"></div>' +
        '<div class="leyenda">' +
          '<span class="it"><span class="marca" style="background:rgb(23,150,140)"></span>largo de δ</span>' +
          '<span class="it"><span class="marca guion" style="border-color:#5c666f"></span>techo σ<sub>1</sub><sup>k</sup></span>' +
          '<span class="it" id="it-rho"><span class="marca punto" style="border-color:#5c666f"></span>ρ<sup>k</sup></span>' +
          '<span class="it" id="nota-rho"></span>' +
        '</div></div>' +
    '</div>';
  raiz.appendChild(tablero);

  V.tira = lienzo(580, 33); document.getElementById('sitio-tira').appendChild(V.tira.c);
  V.ida = lienzo(DG.w, DG.h); document.getElementById('sitio-ida').appendChild(V.ida.c);
  V.cuadrado = lienzo(262, 150); document.getElementById('sitio-cuadrado').appendChild(V.cuadrado.c);
  V.vuelta = lienzo(DG.w, DG.h); document.getElementById('sitio-vuelta').appendChild(V.vuelta.c);
  V.plano = lienzo(476, 256, 'plano'); document.getElementById('sitio-plano').appendChild(V.plano.c);
  V.curva = lienzo(476, 150); document.getElementById('sitio-curva').appendChild(V.curva.c);
  V.plano.c.tabIndex = 0;
  V.plano.c.setAttribute('aria-label', 'Plano de la señal. En el paso 0, las flechas izquierda y derecha giran δ.');

  ['tit-ida', 'tit-vuelta', 'ec-ida1', 'ec-ida2', 'ec-vuelta1', 'ec-vuelta2', 'cifras', 'ficha', 'pista', 'pie-plano',
   'narra', 'nota-lineal', 'it-elipse-d', 'it-rho', 'nota-rho', 'empuje'].forEach(function (id) {
    N[id.replace(/-(\w)/g, function (_, c) { return c.toUpperCase(); })] = document.getElementById(id);
  });
  N.bPaso = document.getElementById('b-paso'); N.bFinal = document.getElementById('b-final');
  N.bReiniciar = document.getElementById('b-reiniciar'); N.bDelta = document.getElementById('b-delta');

  // eventos
  var marcar = function (nombre) {
    barra.querySelectorAll('input[name=' + nombre + ']').forEach(function (inp) { inp.parentNode.classList.toggle('puesto', inp.checked); });
  };
  barra.querySelectorAll('input[name=matriz]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      est.im = +inp.value; est.dT = matriz().dT.slice(); est.k = 0; est.anim = null; marcar('matriz'); recalcular(); todo();
    });
  });
  barra.querySelectorAll('input[name=act]').forEach(function (inp) {
    inp.addEventListener('change', function () { est.tanh = inp.value === 'tanh'; est.anim = null; marcar('act'); recalcular(); todo(); });
  });
  var rango = document.getElementById('a'), rv = document.getElementById('a-val');
  rango.addEventListener('input', function () { est.a = +rango.value; rv.textContent = est.a.toFixed(2); est.anim = null; recalcular(); todo(); });
  N.bPaso.addEventListener('click', function () { if (est.anim) { est.anim = null; } pasoAtras(); });
  N.bFinal.addEventListener('click', hastaFinal);
  N.bReiniciar.addEventListener('click', reiniciar);
  N.bDelta.addEventListener('click', function () { est.dT = matriz().dT.slice(); est.k = 0; est.anim = null; recalcular(); todo(); });

  // arrastrar δ_T en el plano, sólo en k = 0
  var arrastrando = false;
  var fijarDesde = function (ev) {
    var r = V.plano.c.getBoundingClientRect(), G = geometriaPlano(V.plano);
    var x = ev.clientX - r.left - G.cx, y = -(ev.clientY - r.top - G.cy);
    if (Math.hypot(x, y) < 3) return;
    var ang = Math.atan2(y, x); est.dT = [Math.cos(ang), Math.sin(ang)]; recalcular(); todo();
  };
  V.plano.c.addEventListener('pointerdown', function (ev) {
    if (est.k !== 0) return;
    arrastrando = true; V.plano.c.setPointerCapture(ev.pointerId); fijarDesde(ev);
  });
  V.plano.c.addEventListener('pointermove', function (ev) {
    V.plano.c.style.cursor = est.k === 0 ? (arrastrando ? 'grabbing' : 'grab') : 'default';
    if (arrastrando) fijarDesde(ev);
  });
  var soltar = function () { arrastrando = false; };
  V.plano.c.addEventListener('pointerup', soltar); V.plano.c.addEventListener('pointercancel', soltar);
  V.plano.c.addEventListener('keydown', function (ev) {
    if (est.k !== 0 || (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight')) return;
    ev.preventDefault();
    var ang = Math.atan2(est.dT[1], est.dT[0]) + (ev.key === 'ArrowLeft' ? 5 : -5) * Math.PI / 180;
    est.dT = [Math.cos(ang), Math.sin(ang)]; recalcular(); todo();
  });

  recalcular(); todo();
}

function fallar(err) {
  var caja = document.createElement('div');
  caja.id = 'fallo';
  caja.textContent = 'La página no arrancó y no se dibujó ningún lienzo.\n\n' + err.message;
  document.getElementById('raiz').appendChild(caja);
}

/* Las verificaciones corren ANTES de crear ningún lienzo. */
var VERIFICADO = null;
try {
  LINEAS = verificarAncla(construirLineas());
  VERIFICADO = verificarGradiente();
  verificarCifras();
  montar();
} catch (err) {
  fallar(err);
}

/* Para revisar desde la consola o desde un arnés. */
window.EXPL = {
  est: est, verificado: function () { return VERIFICADO; },
  fijarMatriz: function (i) { var inp = document.querySelector('input[name=matriz][value="' + i + '"]'); inp.checked = true; inp.dispatchEvent(new Event('change')); },
  fijarAct: function (tanh) { var inp = document.querySelector('input[name=act][value="' + (tanh ? 'tanh' : 'lineal') + '"]'); inp.checked = true; inp.dispatchEvent(new Event('change')); },
  fijarEmpuje: function (a) { var r = document.getElementById('a'); r.value = a; r.dispatchEvent(new Event('input')); },
  paso: pasoAtras, final: hastaFinal, reiniciar: reiniciar,
  largos: function () { return est.rec.largos.slice(); }
};
</script>
